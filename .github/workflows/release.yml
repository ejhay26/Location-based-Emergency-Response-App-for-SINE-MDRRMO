            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" width="20" height="20" alt="Windows" /> | Windows 10 / 11 (64-bit) | [Download Windows Setup Installer](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.8/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.8_x64-setup.exe) | `.exe` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" width="20" height="20" alt="Windows" /> | Windows 10 / 11 (Portable) | [Download Windows Portable Executable](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.8/MDRRMO.EMERGENCY.RESPONSE.APP_v0.80.8_x64-portable.exe) | `.exe` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/apple/apple-original.svg" width="20" height="20" alt="macOS" /> | Apple Silicon & Intel Macs | [Download macOS Universal DMG](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.8/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.8_universal.dmg) | `.dmg` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/apple/apple-original.svg" width="20" height="20" alt="macOS" /> | Apple Silicon only (M1/M2/M3/M4) | [Download macOS Apple Silicon DMG](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.8/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.8_aarch64.dmg) | `.dmg` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/apple/apple-original.svg" width="20" height="20" alt="macOS" /> | Intel Macs (x64) | [Download macOS Intel DMG](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.8/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.8_x64.dmg) | `.dmg` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg" width="20" height="20" alt="Linux" /> | Debian, Ubuntu, Mint (x86_64) | [Download Linux Debian Package](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.8/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.8_amd64.deb) | `.deb` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg" width="20" height="20" alt="Linux" /> | All Linux Distros (x86_64) | [Download Linux Standalone AppImage](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.8/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.8_amd64.AppImage) | `.AppImage` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg" width="20" height="20" alt="Linux" /> | ARM64 Linux / Raspberry Pi | [Download Linux ARM64 Debian Package](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.8/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.8_arm64.deb) | `.deb` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg" width="20" height="20" alt="Linux" /> | ARM64 Linux / Raspberry Pi | [Download Linux ARM64 AppImage](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.8/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.8_aarch64.AppImage) | `.AppImage` |

          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Portable Executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ inputs.tag || github.ref_name }}"
          EXE_SRC="frontend/src-tauri/target/release/mdrrmo-emergency-response-app.exe"
          PORTABLE_NAME="MDRRMO.EMERGENCY.RESPONSE.APP_${TARGET_TAG}_x64-portable.exe"
          if [ -f "$EXE_SRC" ]; then
            cp "$EXE_SRC" "$PORTABLE_NAME"
            echo "Uploading portable executable: $PORTABLE_NAME"
            gh release upload "$TARGET_TAG" "$PORTABLE_NAME" --clobber
          else
            echo "Warning: $EXE_SRC not found, skipping portable upload."
          fi

  release-android:
    name: Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" || true


      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend web assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Restore Firebase Configuration
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 || secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            if echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > frontend/android/app/google-services.json 2>/dev/null && [ -s frontend/android/app/google-services.json ]; then
              echo "google-services.json successfully restored from Base64."
            else
              echo "$GOOGLE_SERVICES_BASE64" > frontend/android/app/google-services.json
              echo "google-services.json successfully restored from raw JSON."
            fi
            echo "google-services.json size: $(wc -c < frontend/android/app/google-services.json) bytes"
          else
            echo "::warning::Neither GOOGLE_SERVICES_BASE64 nor GOOGLE_SERVICES_JSON secret is set!"
          fi

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > frontend/android/release.keystore
            KEYSTORE_SIZE=$(wc -c < frontend/android/release.keystore)
            echo "Keystore decoded successfully. Size: $KEYSTORE_SIZE bytes"
          else
            echo "Warning: KEYSTORE_BASE64 secret is empty. Release APK will be unsigned."
          fi

      - name: Build Android Release APK
        working-directory: frontend/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Android signing configuration diagnostics:"
          echo "KEYSTORE_PATH: $KEYSTORE_PATH (exists: $([ -f "$KEYSTORE_PATH" ] && echo 'yes' || echo 'no'))"
          echo "KEYSTORE_PASSWORD: $([ -n "$KEYSTORE_PASSWORD" ] && echo 'PRESENT' || echo 'MISSING/EMPTY')"
          echo "KEY_ALIAS: $([ -n "$KEY_ALIAS" ] && echo "$KEY_ALIAS" || echo 'EMPTY (will auto-detect from keystore)')"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Android Release APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ inputs.tag || github.ref_name }}"
          APK_SRC=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_SRC" ] && [ -f "$APK_SRC" ]; then
            APK_NAME="MDRRMO.EMERGENCY.RESPONSE.APP_${TARGET_TAG}_android.apk"
            cp "$APK_SRC" "$APK_NAME"
            echo "Uploading signed Android release APK: $APK_NAME"
