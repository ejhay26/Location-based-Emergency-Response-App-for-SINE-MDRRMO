name: Release Desktop and Mobile Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.79.8)'
        required: false
        default: 'v0.79.8'

permissions:
  contents: write

jobs:
  release-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (NSIS setup installer + Portable executable)
          - platform: 'windows-latest'
            name: 'Windows x64'
            rust_targets: ''
            args: ''

          # macOS Universal (Fat binary containing both Intel & Apple Silicon slices)
          - platform: 'macos-latest'
            name: 'macOS Universal'
            rust_targets: 'x86_64-apple-darwin,aarch64-apple-darwin'
            args: '--target universal-apple-darwin'

          # macOS Intel (x64)
          - platform: 'macos-latest'
            name: 'macOS Intel x64'
            rust_targets: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

          # macOS Apple Silicon (ARM64)
          - platform: 'macos-latest'
            name: 'macOS Apple Silicon ARM64'
            rust_targets: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'

          # Linux x64 (.deb & .AppImage)
          - platform: 'ubuntu-22.04'
            name: 'Linux x64'
            rust_targets: ''
            args: ''

          # Linux ARM64 (.deb & .AppImage)
          - platform: 'ubuntu-24.04-arm'
            name: 'Linux ARM64'
            rust_targets: ''
            args: ''
            experimental: true

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend web assets
        working-directory: frontend
        run: npm run build

      - name: Build and Package with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './frontend'
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'MDRRMO Emergency Response App ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ### What's Changed
            - **Heavy Metal Drop & Spring Dialog Animations**: Added weighted drop and damped metal spring bounce animations to alerts, confirmation popups, and modal dialogs.
            - **Physics-Driven OTP Verification**: Micro-scale bounce on digit typing, in-flight verifying pulse, emerald cascade wave on 6th digit, and horizontal physics error shake.
            - **Action Button Morph States**: Added emerald success state with animated checkmark for primary form submissions.
            - **Seamless Cross-Dissolve Dark Mode**: Replaced circular clip-path expansion with a unified 250ms cross-dissolve transition across Android, iOS, Windows, macOS, and Linux.
            - **Conditional Map Radar Pulse**: Restricted Leaflet radar ripple animations exclusively to fresh, pending incident reports (<10 minutes old) with an automatic 8-cycle cutoff to preserve GPU performance.
            - **Selective Desktop Depth**: Applied high-contrast hover lifts and shadow elevations exclusively to key admin metric cards and active incident rows on cursor-enabled devices.
            - **Shimmer Data Loading**: Added unified skeleton shimmer utility to replace static loading text with responsive placeholder states.
            - **Admin Sidebar & Filters**: Dynamic compact hover sidebar with macOS traffic light clearance, fixed Barangay filter flickering, modernized segmented controls, and polished Date Range Filter.
            - **Automated Signed Android Pipeline**: Enabled headless cloud signing directly within GitHub Actions using the production keystore.

            ### Application Bundles & Assets
            - **Android**: Signed Release APK
            - **Windows (x64)**: NSIS Setup Installer & Standalone Portable executable
            - **macOS**: Universal DMG (Intel & Apple Silicon), Intel x64 DMG, Apple Silicon ARM64 DMG
            - **Linux**: x64 (.deb / .AppImage) & ARM64 (.deb / .AppImage)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Portable Executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ inputs.tag || github.ref_name }}"
          EXE_SRC="frontend/src-tauri/target/release/mdrrmo-emergency-response-app.exe"
          PORTABLE_NAME="MDRRMO EMERGENCY RESPONSE APP_${TARGET_TAG}_x64-portable.exe"
          if [ -f "$EXE_SRC" ]; then
            cp "$EXE_SRC" "$PORTABLE_NAME"
            echo "Uploading portable executable: $PORTABLE_NAME"
            gh release upload "$TARGET_TAG" "$PORTABLE_NAME" --clobber
          else
            echo "Warning: $EXE_SRC not found, skipping portable upload."
          fi

  release-android:
    name: Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend web assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > frontend/android/release.keystore
            KEYSTORE_SIZE=$(wc -c < frontend/android/release.keystore)
            echo "Keystore decoded successfully. Size: $KEYSTORE_SIZE bytes"
          else
            echo "Warning: KEYSTORE_BASE64 secret is empty. Release APK will be unsigned."
          fi

      - name: Build Android Release APK
        working-directory: frontend/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Android signing configuration diagnostics:"
          echo "KEYSTORE_PATH: $KEYSTORE_PATH (exists: $([ -f "$KEYSTORE_PATH" ] && echo 'yes' || echo 'no'))"
          echo "KEYSTORE_PASSWORD: $([ -n "$KEYSTORE_PASSWORD" ] && echo 'PRESENT' || echo 'MISSING/EMPTY')"
          echo "KEY_ALIAS: $([ -n "$KEY_ALIAS" ] && echo "$KEY_ALIAS" || echo 'EMPTY (will auto-detect from keystore)')"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Android Release APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ inputs.tag || github.ref_name }}"
          APK_SRC=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_SRC" ] && [ -f "$APK_SRC" ]; then
            APK_NAME="MDRRMO EMERGENCY RESPONSE APP_${TARGET_TAG}_android.apk"
            cp "$APK_SRC" "$APK_NAME"
            echo "Uploading signed Android release APK: $APK_NAME"
            RELEASE_NOTES="### What's Changed
            - **Heavy Metal Drop & Spring Dialog Animations**: Added weighted drop and damped metal spring bounce animations to alerts, confirmation popups, and modal dialogs.
            - **Physics-Driven OTP Verification**: Micro-scale bounce on digit typing, in-flight verifying pulse, emerald cascade wave on 6th digit, and horizontal physics error shake.
            - **Action Button Morph States**: Added emerald success state with animated checkmark for primary form submissions.
            - **Seamless Cross-Dissolve Dark Mode**: Replaced circular clip-path expansion with a unified 250ms cross-dissolve transition across Android, iOS, Windows, macOS, and Linux.
            - **Conditional Map Radar Pulse**: Restricted Leaflet radar ripple animations exclusively to fresh, pending incident reports (<10 minutes old) with an automatic 8-cycle cutoff to preserve GPU performance.
            - **Selective Desktop Depth**: Applied high-contrast hover lifts and shadow elevations exclusively to key admin metric cards and active incident rows on cursor-enabled devices.
            - **Shimmer Data Loading**: Added unified skeleton shimmer utility to replace static loading text with responsive placeholder states.
            - **Admin Sidebar & Filters**: Dynamic compact hover sidebar with macOS traffic light clearance, fixed Barangay filter flickering, modernized segmented controls, and polished Date Range Filter.
            - **Automated Signed Android Pipeline**: Enabled headless cloud signing directly within GitHub Actions using the production keystore.

            ### Application Bundles & Assets
            - **Android**: Signed Release APK
            - **Windows (x64)**: NSIS Setup Installer & Standalone Portable executable
            - **macOS**: Universal DMG (Intel & Apple Silicon), Intel x64 DMG, Apple Silicon ARM64 DMG
            - **Linux**: x64 (.deb / .AppImage) & ARM64 (.deb / .AppImage)"

            if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
              gh release upload "$TARGET_TAG" "$APK_NAME" --clobber
            else
              gh release create "$TARGET_TAG" "$APK_NAME" --draft --title "MDRRMO Emergency Response App $TARGET_TAG" --notes "$RELEASE_NOTES"
            fi
          else
            echo "Error: Release APK not found in frontend/android/app/build/outputs/apk/release!"
            exit 1
          fi
