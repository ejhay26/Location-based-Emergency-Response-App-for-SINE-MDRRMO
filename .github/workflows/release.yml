name: Release Desktop and Mobile Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.80.7)'
        required: false
        default: 'v0.80.7'

permissions:
  contents: write

jobs:
  release-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (NSIS setup installer + Portable executable)
          - platform: 'windows-latest'
            name: 'Windows x64'
            rust_targets: ''
            args: ''

          # macOS Universal (Fat binary containing both Intel & Apple Silicon slices)
          - platform: 'macos-latest'
            name: 'macOS Universal'
            rust_targets: 'x86_64-apple-darwin,aarch64-apple-darwin'
            args: '--target universal-apple-darwin'

          # macOS Intel (x64)
          - platform: 'macos-latest'
            name: 'macOS Intel x64'
            rust_targets: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

          # macOS Apple Silicon (ARM64)
          - platform: 'macos-latest'
            name: 'macOS Apple Silicon ARM64'
            rust_targets: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'

          # Linux x64 (.deb & .AppImage)
          - platform: 'ubuntu-22.04'
            name: 'Linux x64'
            rust_targets: ''
            args: ''

          # Linux ARM64 (.deb & .AppImage)
          - platform: 'ubuntu-24.04-arm'
            name: 'Linux ARM64'
            rust_targets: ''
            args: ''
            experimental: true

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend web assets
        working-directory: frontend
        run: npm run build

      - name: Build and Package with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './frontend'
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'MDRRMO Emergency Response App ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ### What's Changed
            - **Spotlight Search (Command Palette) Apple HIG Redesign**: Re-engineered modal styling to strictly align with system theme tokens (pure OLED Apple Dark in dark mode, crisp white in light mode), removing artificial navy-blue styling and left accent strips in favor of smooth rounded pill item highlights, crisp typography, and 3D physical keycaps (`.workstation-kbd`).
            - **Strict Role-Based Hotkeys & Sidebar Synchronization**: Realigned all keyboard shortcuts strictly with the sidebar's canonical top-to-bottom layout with strict Role-Based Access Control (RBAC). Dispatchers are restricted to core operations panels (Incident Map: `Ctrl/Cmd + 1`, Log Archive: `Ctrl/Cmd + 2`, Analytics: `Ctrl/Cmd + 3`, Alert Broadcast: `Ctrl/Cmd + 4`), while management panels (Feedback: `Ctrl/Cmd + 5`, ID Verifications: `Ctrl/Cmd + 6`, Dispatchers: `Ctrl/Cmd + 7`, Citizens: `Ctrl/Cmd + 8`) are strictly gated and hidden from dispatchers. System Settings strictly retains `Ctrl + ,` / `⌘ ,`, and Help & Procedures uses `F1`.
            - **Broadcast Composer & Reviewable Draft Workflow**: Re-architected the delivery schedule into a clean two-state selector (`Post Immediately` vs `Schedule for Later`). Replaced cluttered controls with an action toolbar featuring a dedicated secondary `Save as Draft` / `Update Draft` action, live draft editing status banner, and primary `Send Announcement` / `Schedule Announcement` button.
            - **Guided Operations Tour Expansion**: Updated Step 5 (Delivery Schedule), Step 6 (Send Broadcast or Save as Draft), and Step 7 (Saved Drafts Queue) in the interactive Alert Broadcast walkthrough with automatic sequential step renumbering on mobile.
            - **Municipal Coordinate Bounds Validation**: Server-side validation enforcing San Isidro, Nueva Ecija geographic bounding coordinates (`15.25 <= lat <= 15.38`, `120.85 <= lng <= 120.98`) across emergency and hazard submissions, rejecting invalid reports with clear HTTP 422 errors.
            - **Real-Time Fleet & Asset State Synchronization**: Dispatched responder units and vehicles are automatically transitioned to `in_use` status across all operations consoles, restoring back to `available` upon incident resolution or cancellation to prevent accidental double-dispatching.
            - **High-Performance Query Indexing**: Added composite indexes (`idx_emergency_requests_status_time` on `emergency_requests` and `idx_hazards_status_created` on `hazards`) to accelerate live queue filtering and date-range analytics.
            - **Quick Coordinate Copy**: Direct 1-tap coordinate copying with toast confirmation on incident cards.
            - **Clean High-Contrast UI Indicators**: Streamlined indicator badges and unboxed toolbars, replacing unicode symbols with clean SVGs.
            - **Android SDK Setup Resilience**: Configured explicit package installations (`platform-tools`, `platforms;android-36`, `platforms;android-35`, `build-tools;36.0.0`, `build-tools;35.0.0`) in GitHub Actions CI to eliminate obsolete `tools` package sdkmanager failures.
            - **macOS Native Traffic Light Spacing**: Increased window control clearance (`x: 22, y: 20`), widened titlebar clearance space (96px), and added generous top padding to the admin sidebar and main viewport in Tauri macOS builds.
            - **Collapsible Announcement Composer**: Added a collapsible layout with a quick toggle expand/collapse button (`"+ New Announcement"`), saving dashboard space on desktop and mobile while seamlessly preserving composer drafts across tab switches.
            - **Multi-Device Concurrent Session Management**: Maintained independent, concurrent session tokens for administrative and dispatcher accounts across native desktop workstations (Tauri) and mobile apps without premature session termination.
            - **Standardized Citizen ID Verification Layout**: Polished ID verification cards strictly adhering to core app styling with 1-tap ID number copying and direct verification portal links.
            - **Rigid Metallic Dialog Pop Animation**: Re-engineered modal dialog, alert, and popup animations with rigid uniform-scale expansion (`0.88` to `1.028` overshoot to `1.0`), eliminating squash/stretch jelly distortion while locking aspect ratio.
            - **Physics-Driven OTP Verification**: Micro-scale bounce on digit typing, in-flight verifying pulse, emerald cascade wave on 6th digit, animated SVG checkmark overlay, and horizontal physics error shake.
            - **Action Button Morph States**: Added emerald success state with animated checkmark for primary form submissions.
            - **Seamless Cross-Dissolve Dark Mode**: Replaced circular clip-path expansion with a unified 250ms cross-dissolve transition across Android, iOS, Windows, macOS, and Linux, eliminating visual tearing.
            - **Conditional Map Radar Pulse**: Restricted Leaflet radar ripple animations exclusively to fresh, pending incident reports (<10 minutes old) with an automatic 8-cycle cutoff to preserve GPU performance.
            - **Selective Desktop Depth**: Applied high-contrast hover lifts and shadow elevations exclusively to key admin metric cards and active incident rows on cursor-enabled devices.
            - **Shimmer Data Loading**: Added unified skeleton shimmer utility to replace static loading text with responsive placeholder states.
            - **Admin Sidebar & Filters**: Dynamic compact hover sidebar with macOS traffic light clearance, fixed Barangay filter flickering and enabled multi-select combinations, modernized segmented controls, and polished Date Range Filter.

            ### Direct Application Downloads

            | Platform | Target Architecture | Direct Download Link | Format |
            |:---:|:---|:---|:---:|
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/android/android-original.svg" width="20" height="20" alt="Android" /> | Android 7.0+ (ARM / x86) | [Download Android Universal APK](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.7/MDRRMO.EMERGENCY.RESPONSE.APP_v0.80.7_android.apk) | `.apk` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" width="20" height="20" alt="Windows" /> | Windows 10 / 11 (64-bit) | [Download Windows Setup Installer](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.7/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.7_x64-setup.exe) | `.exe` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/windows11/windows11-original.svg" width="20" height="20" alt="Windows" /> | Windows 10 / 11 (Portable) | [Download Windows Portable Executable](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.7/MDRRMO.EMERGENCY.RESPONSE.APP_v0.80.7_x64-portable.exe) | `.exe` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/apple/apple-original.svg" width="20" height="20" alt="macOS" /> | Apple Silicon & Intel Macs | [Download macOS Universal DMG](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.7/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.7_universal.dmg) | `.dmg` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/apple/apple-original.svg" width="20" height="20" alt="macOS" /> | Apple Silicon only (M1/M2/M3/M4) | [Download macOS Apple Silicon DMG](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.7/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.7_aarch64.dmg) | `.dmg` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/apple/apple-original.svg" width="20" height="20" alt="macOS" /> | Intel Macs (x64) | [Download macOS Intel DMG](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.7/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.7_x64.dmg) | `.dmg` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg" width="20" height="20" alt="Linux" /> | Debian, Ubuntu, Mint (x86_64) | [Download Linux Debian Package](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.7/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.7_amd64.deb) | `.deb` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg" width="20" height="20" alt="Linux" /> | All Linux Distros (x86_64) | [Download Linux Standalone AppImage](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.7/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.7_amd64.AppImage) | `.AppImage` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg" width="20" height="20" alt="Linux" /> | ARM64 Linux / Raspberry Pi | [Download Linux ARM64 Debian Package](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.7/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.7_arm64.deb) | `.deb` |
            | <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg" width="20" height="20" alt="Linux" /> | ARM64 Linux / Raspberry Pi | [Download Linux ARM64 AppImage](https://github.com/ejhay26/Location-based-Emergency-Response-App-for-SINE-MDRRMO/releases/download/v0.80.7/MDRRMO.EMERGENCY.RESPONSE.APP_0.80.7_aarch64.AppImage) | `.AppImage` |

          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Portable Executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ inputs.tag || github.ref_name }}"
          EXE_SRC="frontend/src-tauri/target/release/mdrrmo-emergency-response-app.exe"
          PORTABLE_NAME="MDRRMO.EMERGENCY.RESPONSE.APP_${TARGET_TAG}_x64-portable.exe"
          if [ -f "$EXE_SRC" ]; then
            cp "$EXE_SRC" "$PORTABLE_NAME"
            echo "Uploading portable executable: $PORTABLE_NAME"
            gh release upload "$TARGET_TAG" "$PORTABLE_NAME" --clobber
          else
            echo "Warning: $EXE_SRC not found, skipping portable upload."
          fi

  release-android:
    name: Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" || true


      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend web assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Restore Firebase Configuration
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 || secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            if echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > frontend/android/app/google-services.json 2>/dev/null && [ -s frontend/android/app/google-services.json ]; then
              echo "google-services.json successfully restored from Base64."
            else
              echo "$GOOGLE_SERVICES_BASE64" > frontend/android/app/google-services.json
              echo "google-services.json successfully restored from raw JSON."
            fi
            echo "google-services.json size: $(wc -c < frontend/android/app/google-services.json) bytes"
          else
            echo "::warning::Neither GOOGLE_SERVICES_BASE64 nor GOOGLE_SERVICES_JSON secret is set!"
          fi

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > frontend/android/release.keystore
            KEYSTORE_SIZE=$(wc -c < frontend/android/release.keystore)
            echo "Keystore decoded successfully. Size: $KEYSTORE_SIZE bytes"
          else
            echo "Warning: KEYSTORE_BASE64 secret is empty. Release APK will be unsigned."
          fi

      - name: Build Android Release APK
        working-directory: frontend/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Android signing configuration diagnostics:"
          echo "KEYSTORE_PATH: $KEYSTORE_PATH (exists: $([ -f "$KEYSTORE_PATH" ] && echo 'yes' || echo 'no'))"
          echo "KEYSTORE_PASSWORD: $([ -n "$KEYSTORE_PASSWORD" ] && echo 'PRESENT' || echo 'MISSING/EMPTY')"
          echo "KEY_ALIAS: $([ -n "$KEY_ALIAS" ] && echo "$KEY_ALIAS" || echo 'EMPTY (will auto-detect from keystore)')"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Android Release APK
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ inputs.tag || github.ref_name }}"
          APK_SRC=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_SRC" ] && [ -f "$APK_SRC" ]; then
            APK_NAME="MDRRMO.EMERGENCY.RESPONSE.APP_${TARGET_TAG}_android.apk"
            cp "$APK_SRC" "$APK_NAME"
            echo "Uploading signed Android release APK: $APK_NAME"
            RELEASE_NOTES="### What's Changed
