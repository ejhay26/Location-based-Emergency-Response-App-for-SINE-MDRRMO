            - **High-Performance In-Memory Architecture (Containerized Redis & Synced AOF Storage)**: Containerized Redis in Podman (\`redis:alpine\`) with Append-Only File (\`--appendonly yes\`) persistence synced to real host disk (\`./docker/data/redis:/data:Z\`) to survive reboots, enforcing a 256MB memory cap with LRU eviction.
