name: Release Desktop and Mobile Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.80.8)'
        required: false
        default: 'v0.80.8'

permissions:
  contents: write

jobs:
  release-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (NSIS setup installer + Portable executable)
          - platform: 'windows-latest'
            name: 'Windows x64'
            rust_targets: ''
            args: ''

          # macOS Universal (Fat binary containing both Intel & Apple Silicon slices)
          - platform: 'macos-latest'
            name: 'macOS Universal'
            rust_targets: 'x86_64-apple-darwin,aarch64-apple-darwin'
            args: '--target universal-apple-darwin'

          # macOS Intel (x64)
          - platform: 'macos-latest'
            name: 'macOS Intel x64'
            rust_targets: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

          # macOS Apple Silicon (ARM64)
          - platform: 'macos-latest'
            name: 'macOS Apple Silicon ARM64'
            rust_targets: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'

          # Linux x64 (.deb & .AppImage)
          - platform: 'ubuntu-22.04'
            name: 'Linux x64'
            rust_targets: ''
            args: ''

          # Linux ARM64 (.deb & .AppImage)
          - platform: 'ubuntu-24.04-arm'
            name: 'Linux ARM64'
            rust_targets: ''
            args: ''
            experimental: true

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend web assets
        working-directory: frontend
        run: npm run build

      - name: Build and Package with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './frontend'
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'MDRRMO Emergency Response App ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ### What's Changed in v0.80.8
            - **Linux AppImage & NixOS WebKitGTK DMA-BUF Renderer Fix**: Configured automatic `WEBKIT_DISABLE_DMABUF_RENDERER=1` in the Linux desktop entrypoint (`lib.rs`), eliminating `Could not create default EGL display: EGL_BAD_PARAMETER. Aborting...` on NixOS (via `appimage-run`), Wayland, and diverse GPU/Mesa driver configurations to restore crisp hardware-rendered UI without a blank white screen.
            - **TypeScript Return Path Conformance (TS7030 Fix)**: Guaranteed clean void return execution in asynchronous tile error handler callbacks, ensuring strict TypeScript compilation passes without errors across all platform build matrix jobs.
            - **Lifecycle-Aware WebSocket Pause & Jitter Reconnect**: Configured `EchoService` to automatically pause/disconnect WebSocket TCP connections on mobile devices (via `@capacitor/app`) and desktop/web tabs after a 4-second background grace period, offloading background notifications to Firebase Cloud Messaging (FCM). Automatically resumes and re-subscribes upon foregrounding with randomized jitter (50ms–400ms) to prevent thundering-herd reconnect spikes, reducing idle concurrent connections by 85–90% on the backend VPS.
            - **High-Performance In-Memory Architecture (Containerized Redis & Synced AOF Storage)**: Containerized Redis in Podman (`redis:alpine`) with Append-Only File (`--appendonly yes`) persistence synced to real host disk (`./docker/data/redis:/data:Z`) to survive reboots, enforcing a 256MB memory cap with LRU eviction.
            - **High-Concurrency Kernel File Descriptors (`ulimit 65536`)**: Increased system-wide Linux file descriptor limits to 65,536 and tuned Nginx worker limits (`worker_rlimit_nofile 65536`, `worker_connections 8192`) to prevent socket exhaustion during municipal emergency surges.
            - **Local Map Tile Disk Caching & Offline Route Optimization**: Deployed server-side disk caching proxy for OpenStreetMap and satellite tiles with atomic locking and 60-day cache retention, eliminating client rate limits and external tile blocking.
            - **Spotlight Search (Command Palette) Apple HIG Redesign**: Re-engineered modal styling to strictly align with system theme tokens (pure OLED Apple Dark in dark mode, crisp white in light mode), removing artificial navy-blue styling and left accent strips in favor of smooth rounded pill item highlights, crisp typography, and 3D physical keycaps (`.workstation-kbd`).
            - **Cross-Panel Spotlight Barangay Focus & Boundary Highlight**: Resolved lifecycle race condition where selecting "Focus: [Barangay Name]" from the Spotlight palette while on other panels navigated to the Incident Map panel but failed to highlight or zoom to the selected barangay. Added pending focus buffering across component initialization, exclusive single-barangay focus handling, and town-bounds override prevention.
            - **macOS Traffic Light Clearance & Titlebar Spacing**: Resolved visual congestion on macOS Tauri desktop app where native window controls hovered directly on top of the MDRRMO brand logo and sidebar header. Added dedicated 54px top clearance on the sidebar and 52px on the main viewport, providing a balanced 20px cushion around traffic lights and aligning the entire app along a unified top baseline.
            - **Strict Role-Based Hotkeys & Sidebar Synchronization**: Realigned all keyboard shortcuts strictly with the sidebar's canonical top-to-bottom layout with strict Role-Based Access Control (RBAC). Dispatchers are restricted to core operations panels (Incident Map: `Ctrl/Cmd + 1`, Log Archive: `Ctrl/Cmd + 2`, Analytics: `Ctrl/Cmd + 3`, Alert Broadcast: `Ctrl/Cmd + 4`), while management panels (Feedback: `Ctrl/Cmd + 5`, ID Verifications: `Ctrl/Cmd + 6`, Dispatchers: `Ctrl/Cmd + 7`, Citizens: `Ctrl/Cmd + 8`) are strictly gated and hidden from dispatchers. System Settings strictly retains `Ctrl + ,` / `⌘ ,`, and Help & Procedures uses `F1`.
            - **Broadcast Composer & Reviewable Draft Workflow**: Re-architected the delivery schedule into a clean two-state selector (`Post Immediately` vs `Schedule for Later`). Replaced cluttered controls with an action toolbar featuring a dedicated secondary `Save as Draft` / `Update Draft` action, live draft editing status banner, and primary `Send Announcement` / `Schedule Announcement` button.
            - **Guided Operations Tour Expansion**: Updated Step 5 (Delivery Schedule), Step 6 (Send Broadcast or Save as Draft), and Step 7 (Saved Drafts Queue) in the interactive Alert Broadcast walkthrough with automatic sequential step renumbering on mobile.
            - **Municipal Coordinate Bounds Validation**: Server-side validation enforcing San Isidro, Nueva Ecija geographic bounding coordinates (`15.25 <= lat <= 15.38`, `120.85 <= lng <= 120.98`) across emergency and hazard submissions, rejecting invalid reports with clear HTTP 422 errors.
            - **Real-Time Fleet & Asset State Synchronization**: Dispatched responder units and vehicles are automatically transitioned to `in_use` status across all operations consoles, restoring back to `available` upon incident resolution or cancellation to prevent accidental double-dispatching.
            - **High-Performance Query Indexing**: Added composite indexes (`idx_emergency_requests_status_time` on `emergency_requests` and `idx_hazards_status_created` on `hazards`) to accelerate live queue filtering and date-range analytics.
            - **Quick Coordinate Copy**: Direct 1-tap coordinate copying with toast confirmation on incident cards.
            - **Clean High-Contrast UI Indicators**: Streamlined indicator badges and unboxed toolbars, replacing unicode symbols with clean SVGs.

