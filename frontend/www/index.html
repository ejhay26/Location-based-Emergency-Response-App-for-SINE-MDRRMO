  <style>
    /* ── Immediate First-Paint Splash Screen ──────────────────────────────── */
    #sine-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100vh + 120px);
      background: #ffffff;
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: all;
      /* Downward convex arc at bottom */
      clip-path: ellipse(140% 100% at 50% 0%);
      will-change: transform, clip-path, opacity;
      transform: translateZ(0);
    }

    #sine-splash.splash-dismiss {
      animation: splashArcFlyUp 720ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: none;
    }

    @keyframes splashArcFlyUp {
      0% {
        transform: translateY(0);
        clip-path: ellipse(140% 100% at 50% 0%);
      }
      35% {
        clip-path: ellipse(120% 95% at 50% -5%);
      }
      100% {
        transform: translateY(-115%);
        clip-path: ellipse(105% 90% at 50% -10%);
        opacity: 0.98;
      }
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      margin-top: -60px;
    }

    .splash-badge {
      position: relative;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      padding: 3px;
      background: #D32F2F;
      box-shadow: 0 4px 20px rgba(211, 47, 47, 0.28);
      margin-bottom: 20px;
    }

    .splash-logo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .splash-headers {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .splash-org {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #D32F2F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin-bottom: 6px;
    }

    .splash-title {
      font-size: 18px;
      font-weight: 700;
      color: #111113;
      letter-spacing: 0.02em;
      margin: 0 0 6px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .splash-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: #5c5c60;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .splash-progress-track {
      width: 180px;
      height: 3px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }

    .splash-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: #D32F2F;
      border-radius: 999px;
      animation: splashIndeterminate 1.4s infinite ease-in-out;
    }

    @keyframes splashIndeterminate {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 35%;
        width: 50%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }

    .splash-status-text {
      font-size: 11px;
      color: #8e8e93;
      letter-spacing: 0.02em;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
