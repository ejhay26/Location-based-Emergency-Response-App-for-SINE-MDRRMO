<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgGrad)"/>

  <!-- Face / Person Silhouette -->
  <!-- Shoulders / Torso -->
  <path d="M120 450 C120 310 200 270 300 270 C400 270 480 310 480 450 Z" fill="#455a64"/>
  <!-- Neck -->
  <rect x="270" y="220" width="60" height="70" fill="#ffccbc"/>
  <!-- Head / Face -->
  <ellipse cx="300" cy="160" rx="75" ry="95" fill="#ffccbc"/>
  <!-- Hair -->
  <path d="M210 160 C210 70 390 70 390 160 C390 120 370 100 300 100 C230 100 210 120 210 160 Z" fill="#263238"/>
  <!-- Eyes -->
  <ellipse cx="270" cy="155" rx="8" ry="5" fill="#37474f"/>
  <ellipse cx="330" cy="155" rx="8" ry="5" fill="#37474f"/>
  <!-- Smile -->
  <path d="M280 200 Q300 215 320 200" fill="none" stroke="#d84315" stroke-width="3" stroke-linecap="round"/>

  <!-- Hand holding the ID card near chest -->
  <rect x="290" y="270" width="220" height="140" rx="10" fill="#e8f4f8" stroke="#0038a8" stroke-width="2.5" transform="rotate(-5 400 340)"/>
  <rect x="295" y="275" width="210" height="10" fill="#ce1126" transform="rotate(-5 400 340)"/>
  <text x="320" y="310" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0038a8" transform="rotate(-5 400 340)">PHILIPPINE NATIONAL ID</text>
  <text x="320" y="325" font-family="Arial, sans-serif" font-size="8" fill="#555" transform="rotate(-5 400 340)">SANTOS, MARIA CLARA</text>
  <text x="320" y="340" font-family="monospace" font-size="9" fill="#0038a8" font-weight="bold" transform="rotate(-5 400 340)">1234-5678-9012-3456</text>
  <rect x="440" y="300" width="55" height="65" rx="4" fill="#cfd8dc" stroke="#90a4ae" transform="rotate(-5 400 340)"/>

  <!-- Fingers holding card -->
  <ellipse cx="485" cy="380" rx="12" ry="18" fill="#ffccbc" stroke="#d7ccc8" stroke-width="1"/>
  <ellipse cx="505" cy="370" rx="12" ry="18" fill="#ffccbc" stroke="#d7ccc8" stroke-width="1"/>

  <!-- Live Verification Badge Overlay -->
  <rect x="20" y="20" width="160" height="32" rx="16" fill="rgba(45,211,111,0.9)"/>
  <circle cx="36" cy="36" r="6" fill="#ffffff"/>
  <text x="50" y="41" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">LIVE VERIFIED SELFIE</text>
</svg>
