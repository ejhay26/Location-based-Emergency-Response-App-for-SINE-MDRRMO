<ion-content>
  <!-- Only render content once we confirm it's a first-time user.
       This prevents the 1-frame flash on returning users. -->
  <div *ngIf="isFirstTime" style="
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    padding: 60px 28px 48px 28px;
    text-align: center;
    background: var(--ion-color-danger);
  ">

    <!-- Top: Logo + Name block -->
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">

      <!-- Logo -->
      <div style="
        width: 110px; height: 110px;
        background: rgba(255,255,255,0.15);
        border-radius: 28px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 28px;
      ">
        <i class="fa-solid fa-shield-halved" style="font-size: 60px; color: white;"></i>
      </div>

      <!-- App identity -->
      <p style="
        margin: 0 0 6px 0;
        font-size: 13px;
        font-weight: 700;
        color: rgba(255,255,255,0.75);
        letter-spacing: 2px;
        text-transform: uppercase;
      ">MDRRMO San Isidro Nueva Ecija</p>

      <h1 style="
        margin: 0 0 6px 0;
        font-size: 52px;
        font-weight: 900;
        color: white;
        letter-spacing: 4px;
        line-height: 1;
      ">Location-Based Emergency Response App</h1>

      <p style="
        margin: 0 0 40px 0;
        font-size: 15px;
        font-weight: 500;
        color: rgba(255,255,255,0.7);
        letter-spacing: 0.5px;
      ">Report an Emergency or Hazard at your place</p>

      <!-- Feature pills -->
      <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
        <div style="
          background: rgba(255,255,255,0.18);
          border-radius: 20px;
          padding: 7px 14px;
          font-size: 12px;
          color: white;
          font-weight: 600;
        ">
          <i class="fa-solid fa-location-dot" style="margin-right: 5px;"></i>Live Map
        </div>
        <div style="
          background: rgba(255,255,255,0.18);
          border-radius: 20px;
          padding: 7px 14px;
          font-size: 12px;
          color: white;
          font-weight: 600;
        ">
          <i class="fa-solid fa-triangle-exclamation" style="margin-right: 5px;"></i>SOS Alerts
        </div>
        <div style="
          background: rgba(255,255,255,0.18);
          border-radius: 20px;
          padding: 7px 14px;
          font-size: 12px;
          color: white;
          font-weight: 600;
        ">
          <i class="fa-solid fa-road-barrier" style="margin-right: 5px;"></i>Hazard Reports
        </div>
      </div>

    </div>

    <!-- Bottom: CTA buttons -->
    <div style="width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 48px;">

      <ion-button expand="block" (click)="goToRegister()" style="
        --background: white;
        --color: var(--ion-color-danger);
        --border-radius: 14px;
        --box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        font-weight: 800;
        font-size: 16px;
        height: 54px;
      ">
        <i class="fa-solid fa-user-plus" style="margin-right: 10px;"></i>
        Create an Account
      </ion-button>

      <ion-button expand="block" fill="outline" (click)="goToLogin()" style="
        --border-color: rgba(255,255,255,0.5);
        --color: white;
        --border-radius: 14px;
        font-weight: 700;
        font-size: 15px;
        height: 50px;
      ">
        <i class="fa-solid fa-right-to-bracket" style="margin-right: 10px;"></i>
        I Already Have an Account
      </ion-button>

    </div>

  </div>
</ion-content>
