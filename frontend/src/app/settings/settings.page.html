<ion-header class="ion-no-border">
  <ion-toolbar color="danger">
    <ion-title style="color:white;font-weight:bold;">Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content style="--padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));">

  <!-- ── Appearance ─────────────────────────────────────────────────── -->
  <ion-list lines="none" style="padding:16px 16px 0;">
    <ion-list-header style="padding-left:0;margin-bottom:4px;">
      <ion-label color="danger" style="font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.8px;">
        <i class="fa-solid fa-palette" style="margin-right:7px;"></i>Appearance
      </ion-label>
    </ion-list-header>

    <ion-item *ngFor="let s of appearance"
              style="--background:var(--ion-card-background,var(--ion-color-light));border-radius:14px;margin-bottom:10px;--inner-padding-end:16px;">
      <ion-label style="padding:14px 0 10px;">
        <p style="font-weight:600;font-size:15px;color:var(--ion-text-color);margin:0 0 4px;">{{ s.label }}</p>
        <p style="font-size:12px;color:var(--ion-color-medium);margin:0;line-height:1.4;">{{ s.hint(s.value) }}</p>
      </ion-label>
      <ion-toggle slot="end" color="danger"
                  [(ngModel)]="s.value"
                  (ionChange)="onToggle(s)">
      </ion-toggle>
    </ion-item>
  </ion-list>

  <!-- ── Map & Location ─────────────────────────────────────────────── -->
  <ion-list lines="none" style="padding:8px 16px 0;">
    <ion-list-header style="padding-left:0;margin-bottom:4px;">
      <ion-label color="danger" style="font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.8px;">
        <i class="fa-solid fa-map-location-dot" style="margin-right:7px;"></i>Map &amp; Location
      </ion-label>
    </ion-list-header>

    <ion-item *ngFor="let s of location"
              style="--background:var(--ion-card-background,var(--ion-color-light));border-radius:14px;margin-bottom:10px;--inner-padding-end:16px;">
      <ion-label style="padding:14px 0 10px;">
        <p style="font-weight:600;font-size:15px;color:var(--ion-text-color);margin:0 0 4px;">{{ s.label }}</p>
        <p style="font-size:12px;color:var(--ion-color-medium);margin:0;line-height:1.4;">{{ s.hint(s.value) }}</p>
      </ion-label>
      <ion-toggle slot="end" color="danger"
                  [(ngModel)]="s.value"
                  (ionChange)="onToggle(s)">
      </ion-toggle>
    </ion-item>

    <div *ngFor="let s of mapSettings"
         style="background:var(--ion-card-background,var(--ion-color-light));border-radius:14px;
                margin-bottom:10px;padding:14px 16px;
                display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div style="flex:1;">
        <p style="font-weight:600;font-size:15px;color:var(--ion-text-color);margin:0 0 4px;">{{ s.label }}</p>
        <p style="font-size:12px;color:var(--ion-color-medium);margin:0;line-height:1.4;">{{ s.hint }}</p>
      </div>
      <!-- Plain buttons instead of ion-select to avoid the ripple-on-row issue -->
      <div style="display:flex;border-radius:10px;overflow:hidden;
                  border:1.5px solid var(--ion-color-step-200,#ccc);flex-shrink:0;">
        <button *ngFor="let opt of s.options"
                (click)="s.value = opt.value; onSelect(s)"
                [style.background]="s.value === opt.value ? 'var(--ion-color-danger)' : 'transparent'"
                [style.color]="s.value === opt.value ? 'white' : 'var(--ion-text-color)'"
                style="border:none;padding:7px 14px;font-size:13px;font-weight:700;
                       cursor:pointer;transition:background 0.2s,color 0.2s;">
          {{ opt.label }}
        </button>
      </div>
    </div>
  </ion-list>

  <!-- ── Notifications ─────────────────────────────────────────────── -->
  <ion-list lines="none" style="padding:8px 16px 0;">
    <ion-list-header style="padding-left:0;margin-bottom:4px;">
      <ion-label color="danger" style="font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.8px;">
        <i class="fa-solid fa-bell" style="margin-right:7px;"></i>Notifications
      </ion-label>
    </ion-list-header>

    <ion-item *ngFor="let s of notifications"
              style="--background:var(--ion-card-background,var(--ion-color-light));border-radius:14px;margin-bottom:10px;--inner-padding-end:16px;">
      <ion-label style="padding:14px 0 10px;">
        <p style="font-weight:600;font-size:15px;color:var(--ion-text-color);margin:0 0 4px;">{{ s.label }}</p>
        <p style="font-size:12px;color:var(--ion-color-medium);margin:0;line-height:1.4;">{{ s.hint(s.value) }}</p>
      </ion-label>
      <ion-toggle slot="end" color="danger"
                  [(ngModel)]="s.value"
                  (ionChange)="onToggle(s)">
      </ion-toggle>
    </ion-item>
  </ion-list>

  <!-- ── App info ───────────────────────────────────────────────────── -->
  <div style="padding:16px;text-align:center;margin-top:8px;">
    <p style="font-size:12px;color:var(--ion-color-medium);margin:0;">
      MDRRMO San Isidro Emergency App<br>
      <span style="font-size:11px;">Settings are saved automatically and synced across devices.</span>
    </p>
  </div>

</ion-content>
