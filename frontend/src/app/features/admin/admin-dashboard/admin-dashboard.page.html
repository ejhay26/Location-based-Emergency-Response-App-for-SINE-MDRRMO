<ion-content class="ion-padding" style="--padding-top: 0; --padding-bottom: 0; --padding-start: 0; --padding-end: 0; --overflow: hidden;">
  <div class="admin-desktop-wrapper">

    <!-- ── MOBILE TOP NAVIGATION BAR (FIXED AT TOP ON SUB-PANELS & MENU) ── -->
    <div *ngIf="!isMapView" class="admin-mobile-header">
      <!-- 1. Left Action: Back to Menu button when inside a sub-panel -->
      <div class="mobile-header-left">
        <button *ngIf="isSubPanel" id="mobile-nav-back-btn" (click)="selectViewMode('menu')" class="mobile-nav-back-btn" aria-label="Back to Menu">
          <app-icon name="chevron-left" [size]="20" color="#ffffff"></app-icon>
          <span>Menu</span>
        </button>
        <!-- On Menu root tab: clean title with no icon -->
        <h4 *ngIf="viewMode === 'menu'" class="mobile-header-menu-title">Menu</h4>
        <!-- On other main tabs (Broadcast, Archive): brand logo + title -->
        <div *ngIf="!isSubPanel && viewMode !== 'menu'" class="mobile-header-title">
          <img src="assets/icon/logo.jpg" alt="MDRRMO logo" class="mobile-header-logo" />
          <div style="min-width: 0;">
            <h5 class="mobile-title-main">{{ currentViewTitle }}</h5>
            <span class="mobile-role-tag">{{ currentRole === 'admin' ? 'Administrator' : 'Dispatcher' }}</span>
          </div>
        </div>
      </div>

      <!-- 2. Center: Sub-panel title (Centered across navbar) -->
      <div *ngIf="isSubPanel" class="mobile-header-subpanel-title">
        <h5 class="subpanel-title-text">{{ currentViewTitle }}</h5>
      </div>

      <!-- 3. Right: Role / Status Badge -->
      <div class="mobile-header-right">
        <span class="mobile-role-badge-pill">{{ currentRole === 'admin' ? 'Admin' : 'Dispatcher' }}</span>
      </div>
    </div>

    <!-- Mobile Sidebar Backdrop (clicking outside closes drawer) -->
    <div *ngIf="isMobileSidebarOpen" class="mobile-sidebar-backdrop" (click)="closeMobileSidebar()"></div>

    <div class="admin-desktop-body">
      <!-- ── SIDEBAR ── -->
      <div class="admin-sidebar" [class.mobile-open]="isMobileSidebarOpen" [style.width]="isSidebarCollapsed ? '72px' : (sidebarWidth + 'px')">
        <div style="display: flex; flex-direction: column; height: 100%;">
          
          <!-- Brand Header & Collapse Toggle -->
          <div style="padding-bottom: 12px; border-bottom: 1px solid var(--ion-color-step-150, rgba(0,0,0,0.08)); margin-bottom: 14px; display: flex; align-items: center; min-height: 44px;" [style.justify-content]="isSidebarCollapsed ? 'center' : 'space-between'">
            <div *ngIf="!isSidebarCollapsed" style="display: flex; align-items: center; gap: 9px; min-width: 0; overflow: hidden;">
              <img src="assets/icon/logo.jpg" alt="MDRRMO San Isidro logo" style="width: 30px; height: 30px; border-radius: 8px; object-fit: cover; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.12);" />
              <h5 style="margin: 0; font-weight: 800; color: var(--ion-text-color); letter-spacing: 0.4px; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">MDRRMO SAN ISIDRO</h5>
            </div>
            <button (click)="toggleSidebar()" [title]="isSidebarCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'" class="sidebar-toggle-btn">
              <app-icon name="menu" [size]="20" color="var(--ion-text-color)"></app-icon>
            </button>
          </div>

          <!-- Categorized Navigation Container -->
          <div style="display: flex; flex-direction: column; gap: 14px; overflow-y: auto; overflow-x: hidden; flex: 1; padding-right: 2px;">
            
            <!-- SECTION 1: DISPATCH & MAPS -->
            <div class="sidebar-section">
              <div class="sidebar-section-header" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                <span *ngIf="!isSidebarCollapsed">Dispatch &amp; Maps</span>
                <span *ngIf="isSidebarCollapsed" class="sidebar-section-dot"></span>
              </div>
              <div class="sidebar-section-items">
                <button id="nav-btn-active" (click)="selectViewMode('active')" title="Live Incident & Hazard Map" class="menu-capsule-link" [class.active]="viewMode === 'active'" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                  <div class="sidebar-icon-wrap" [style.margin-right]="isSidebarCollapsed ? '0' : '12px'">
                    <app-icon name="map" [size]="18" [color]="viewMode === 'active' ? '#ffffff' : 'var(--ion-color-danger)'"></app-icon>
                    <!-- Collapsed Icon Corner Badge -->
                    <span *ngIf="isSidebarCollapsed && activeIncidentsCount > 0" class="sidebar-icon-badge sidebar-icon-badge--danger">
                      {{ activeIncidentsCount > 99 ? '99+' : activeIncidentsCount }}
                    </span>
                  </div>
                  <span *ngIf="!isSidebarCollapsed" class="sidebar-label">Incident Map</span>
                  <!-- Expanded Right Pill Badge -->
                  <span *ngIf="!isSidebarCollapsed && activeIncidentsCount > 0" class="sidebar-pill-badge sidebar-pill-badge--danger">
                    {{ activeIncidentsCount > 99 ? '99+' : activeIncidentsCount }}
                  </span>
                </button>
              </div>
            </div>

            <!-- SECTION 2: RECORDS & INSIGHTS -->
            <div class="sidebar-section">
              <div class="sidebar-section-header" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                <span *ngIf="!isSidebarCollapsed">Records &amp; Insights</span>
                <span *ngIf="isSidebarCollapsed" class="sidebar-section-dot"></span>
              </div>
              <div class="sidebar-section-items">
                <button id="nav-btn-archive" (click)="selectViewMode('archive')" title="Historical Emergency Incident Logs" class="menu-capsule-link" [class.active]="viewMode === 'archive'" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                  <div class="sidebar-icon-wrap" [style.margin-right]="isSidebarCollapsed ? '0' : '12px'">
                    <app-icon name="history" [size]="18" [color]="viewMode === 'archive' ? '#ffffff' : 'var(--ion-color-danger)'"></app-icon>
                  </div>
                  <span *ngIf="!isSidebarCollapsed" class="sidebar-label">Log Archive</span>
                </button>
                <button id="nav-btn-analytics" (click)="selectViewMode('analytics')" title="Statistical Incident Reports & Response Times" class="menu-capsule-link" [class.active]="viewMode === 'analytics'" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                  <div class="sidebar-icon-wrap" [style.margin-right]="isSidebarCollapsed ? '0' : '12px'">
                    <app-icon name="chart-pie" [size]="18" [color]="viewMode === 'analytics' ? '#ffffff' : 'var(--ion-color-danger)'"></app-icon>
                  </div>
                  <span *ngIf="!isSidebarCollapsed" class="sidebar-label">Analytics</span>
                </button>
              </div>
            </div>

            <!-- SECTION 3: COMMUNICATIONS -->
            <div class="sidebar-section">
              <div class="sidebar-section-header" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                <span *ngIf="!isSidebarCollapsed">Communications</span>
                <span *ngIf="isSidebarCollapsed" class="sidebar-section-dot"></span>
              </div>
              <div class="sidebar-section-items">
                <button id="nav-btn-broadcast" (click)="selectViewMode('broadcast')" title="Send Emergency Public Advisories & Push Alerts" class="menu-capsule-link" [class.active]="viewMode === 'broadcast'" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                  <div class="sidebar-icon-wrap" [style.margin-right]="isSidebarCollapsed ? '0' : '12px'">
                    <app-icon name="siren" [size]="18" [color]="viewMode === 'broadcast' ? '#ffffff' : 'var(--ion-color-danger)'"></app-icon>
                  </div>
                  <span *ngIf="!isSidebarCollapsed" class="sidebar-label">Alert Broadcast</span>
                </button>
                <button *ngIf="currentRole === 'admin'" id="nav-btn-feedback" (click)="selectViewMode('feedback')" title="Citizen Incident Reviews & Response Ratings" class="menu-capsule-link" [class.active]="viewMode === 'feedback'" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                  <div class="sidebar-icon-wrap" [style.margin-right]="isSidebarCollapsed ? '0' : '12px'">
                    <app-icon name="message-square" [size]="18" [color]="viewMode === 'feedback' ? '#ffffff' : 'var(--ion-color-danger)'"></app-icon>
                  </div>
                  <span *ngIf="!isSidebarCollapsed" class="sidebar-label">Feedback</span>
                </button>
              </div>
            </div>

            <!-- SECTION 4: MANAGEMENT (Admin Only) -->
            <div *ngIf="currentRole === 'admin'" class="sidebar-section">
              <div class="sidebar-section-header" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                <span *ngIf="!isSidebarCollapsed">Management</span>
                <span *ngIf="isSidebarCollapsed" class="sidebar-section-dot"></span>
              </div>
              <div class="sidebar-section-items">
                <button id="nav-btn-verifications" (click)="selectViewMode('verifications')" title="Citizen ID & KYC Verification Queue" class="menu-capsule-link" [class.active]="viewMode === 'verifications'" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                  <div class="sidebar-icon-wrap" [style.margin-right]="isSidebarCollapsed ? '0' : '12px'">
                    <app-icon name="id-card" [size]="18" [color]="viewMode === 'verifications' ? '#ffffff' : 'var(--ion-color-danger)'"></app-icon>
                    <!-- Collapsed Icon Corner Badge -->
                    <span *ngIf="isSidebarCollapsed && pendingVerificationsCount > 0" class="sidebar-icon-badge sidebar-icon-badge--warning">
                      {{ pendingVerificationsCount > 99 ? '99+' : pendingVerificationsCount }}
                    </span>
                  </div>
                  <span *ngIf="!isSidebarCollapsed" class="sidebar-label">ID Verifications</span>
                  <!-- Expanded Right Pill Badge -->
                  <span *ngIf="!isSidebarCollapsed && pendingVerificationsCount > 0" class="sidebar-pill-badge sidebar-pill-badge--warning">
                    {{ pendingVerificationsCount > 99 ? '99+' : pendingVerificationsCount }}
                  </span>
                </button>
                <button id="nav-btn-dispatchers" (click)="selectViewMode('dispatchers')" title="Manage Dispatcher & Responder Staff Accounts" class="menu-capsule-link" [class.active]="viewMode === 'dispatchers'" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                  <div class="sidebar-icon-wrap" [style.margin-right]="isSidebarCollapsed ? '0' : '12px'">
                    <app-icon name="user-gear" [size]="18" [color]="viewMode === 'dispatchers' ? '#ffffff' : 'var(--ion-color-danger)'"></app-icon>
                  </div>
                  <span *ngIf="!isSidebarCollapsed" class="sidebar-label">Dispatchers</span>
                </button>
                <button id="nav-btn-citizens" (click)="selectViewMode('citizens')" title="Registered Citizen Accounts & Moderation" class="menu-capsule-link" [class.active]="viewMode === 'citizens'" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                  <div class="sidebar-icon-wrap" [style.margin-right]="isSidebarCollapsed ? '0' : '12px'">
                    <app-icon name="users" [size]="18" [color]="viewMode === 'citizens' ? '#ffffff' : 'var(--ion-color-danger)'"></app-icon>
                  </div>
                  <span *ngIf="!isSidebarCollapsed" class="sidebar-label">Citizens</span>
                </button>
              </div>
            </div>

            <!-- SECTION 5: SYSTEM -->
            <div class="sidebar-section">
              <div class="sidebar-section-header" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                <span *ngIf="!isSidebarCollapsed">System</span>
                <span *ngIf="isSidebarCollapsed" class="sidebar-section-dot"></span>
              </div>
              <div class="sidebar-section-items">
                <button id="nav-btn-settings" (click)="selectViewMode('settings')" title="System Settings, Audio Alerts & Theme" class="menu-capsule-link" [class.active]="viewMode === 'settings'" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                  <app-icon name="settings" [size]="18" [color]="viewMode === 'settings' ? '#ffffff' : 'var(--ion-color-danger)'" [style.margin-right]="isSidebarCollapsed ? '0' : '12px'"></app-icon>
                  <span *ngIf="!isSidebarCollapsed">Settings</span>
                </button>
                <button id="nav-btn-help" (click)="selectViewMode('help')" title="Help & Operations Guides" class="menu-capsule-link" [class.active]="viewMode === 'help'" [style.justify-content]="isSidebarCollapsed ? 'center' : 'flex-start'">
                  <app-icon name="graduation-cap" [size]="18" [color]="viewMode === 'help' ? '#ffffff' : 'var(--ion-color-danger)'" [style.margin-right]="isSidebarCollapsed ? '0' : '12px'"></app-icon>
                  <span *ngIf="!isSidebarCollapsed">Help & Procedures</span>
                </button>
              </div>
            </div>

          </div>
        </div>

        <!-- Draggable Resizer Handle on right border -->
        <div *ngIf="!isSidebarCollapsed"
             class="sidebar-resize-handle"
             (mousedown)="onMouseDownResize($event)"
             title="Drag to resize sidebar width">
          <div class="resize-line"></div>
        </div>
      </div>

      <!-- ── MAIN VIEWPORT ── -->
      <div class="admin-main-viewport">
        <!-- incident-map renders its own flex layout -->
        <div *ngIf="isMapView" style="flex: 1; display: flex; min-width: 0; height: 100%; overflow: hidden;">
          <app-incident-map-panel style="flex: 1; display: flex; min-width: 0;"></app-incident-map-panel>
        </div>

        <!-- analytics renders its own scroll container -->
        <div *ngIf="viewMode === 'analytics'"
             class="admin-scroll-panel"
             [class.panel-slide-forward]="isSubPanel && navDirection === 'forward'"
             style="flex: 1; display: flex; min-width: 0; height: 100%; overflow: hidden;">
          <app-analytics-panel style="flex: 1; display: flex; min-width: 0;"></app-analytics-panel>
        </div>

        <!-- Dedicated Mobile Menu Panel (Hub) -->
        <div *ngIf="viewMode === 'menu'"
             class="admin-scroll-panel menu-panel-wrapper"
             [class.panel-slide-back]="navDirection === 'back'"
             style="width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden;">
          <app-mobile-menu-panel
            [currentRole]="currentRole || 'admin'"
            [pendingVerificationsCount]="pendingVerificationsCount"
            (viewSelect)="navigateToSubPanel($any($event))"
            (logout)="logout()">
          </app-mobile-menu-panel>
        </div>

        <!-- Single-column panels share one full-width scrollable container with slide transitions -->
        <div *ngIf="!isMapView && viewMode !== 'analytics' && viewMode !== 'menu'"
             class="admin-scroll-panel"
             [class.panel-slide-forward]="isSubPanel && navDirection === 'forward'"
             style="width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden;">
          <app-verifications-panel *ngIf="viewMode === 'verifications'"></app-verifications-panel>
          <app-log-archive-panel   *ngIf="viewMode === 'archive'"></app-log-archive-panel>
          <app-broadcast-panel     *ngIf="viewMode === 'broadcast'"></app-broadcast-panel>
          <app-dispatchers-panel   *ngIf="viewMode === 'dispatchers'"></app-dispatchers-panel>
          <app-citizens-panel      *ngIf="viewMode === 'citizens'"></app-citizens-panel>
          <app-feedback-panel      *ngIf="viewMode === 'feedback'"></app-feedback-panel>
          <app-settings-panel      *ngIf="viewMode === 'settings'"></app-settings-panel>
          <app-help-panel          *ngIf="viewMode === 'help'" [isAdmin]="currentRole === 'admin' || currentRole === 'Admin'"></app-help-panel>
        </div>
      </div>

    </div><!-- end admin-desktop-body -->

    <!-- ── MOBILE 4-TAB BOTTOM NAVIGATION BAR (MOBILE ONLY - HIDDEN ON SUB-PANELS) ── -->
    <app-mobile-admin-nav
      *ngIf="!isSubPanel"
      class="mobile-bottom-nav-wrapper"
      [currentView]="$any(viewMode)"
      [activeIncidentsCount]="activeIncidentsCount"
      [pendingVerificationsCount]="pendingVerificationsCount"
      (viewChange)="selectViewMode($any($event))">
    </app-mobile-admin-nav>

  </div><!-- end admin-desktop-wrapper -->
</ion-content>
