<div style="padding: 24px 32px 48px; max-width: 1200px; margin: 0 auto;">

  <!-- Header Banner -->
  <div style="margin-bottom: 28px;">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 6px;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, rgba(235,68,90,0.15), rgba(235,68,90,0.05)); border: 1px solid rgba(235,68,90,0.25); display: flex; align-items: center; justify-content: center; color: var(--ion-color-danger);">
        <app-icon name="graduation-cap" [size]="22" color="var(--ion-color-danger)"></app-icon>
      </div>
      <div>
        <h2 style="margin: 0; font-size: 22px; font-weight: 800; color: var(--ion-text-color); letter-spacing: -0.3px;">
          Help &amp; Operations Guides
        </h2>
        <p style="margin: 2px 0 0; font-size: 13px; color: var(--ion-color-medium);">
          Step-by-step guides and interactive walkthroughs for MDRRMO dispatchers.
        </p>
      </div>
    </div>
  </div>

  <!-- SECTION 1: PROCEDURAL INTERACTIVE WALKTHROUGHS -->
  <div style="margin-bottom: 32px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <app-icon name="play" [size]="16" color="var(--ion-color-danger)"></app-icon>
        <h3 style="margin: 0; font-size: 15px; font-weight: 800; color: var(--ion-text-color); text-transform: uppercase; letter-spacing: 0.5px;">
          Interactive System Walkthroughs
        </h3>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: var(--ion-color-medium);">
        Click any guide to launch a guided spotlight tour
      </span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px;">
      <div *ngFor="let proc of filteredProcedures"
           style="background: var(--ion-card-background, #ffffff); border-radius: 16px; border: 1px solid var(--ion-color-step-150, rgba(0,0,0,0.08)); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 16px rgba(0,0,0,0.04); transition: transform 0.2s ease, box-shadow 0.2s ease;">
        <div>
          <!-- Card Top Bar -->
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
            <div style="width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;"
                 [style.background]="proc.badgeColor + '18'">
              <app-icon [name]="proc.icon" [size]="18" [color]="proc.badgeColor"></app-icon>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              <span style="font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px;"
                    [style.background]="proc.badgeColor + '18'" [style.color]="proc.badgeColor">
                {{ proc.category }}
              </span>
            </div>
          </div>

          <!-- Card Title & Description -->
          <h4 style="margin: 0 0 6px; font-size: 15px; font-weight: 800; color: var(--ion-text-color);">
            {{ proc.title }}
          </h4>
          <p style="margin: 0 0 16px; font-size: 12.5px; color: var(--ion-color-medium); line-height: 1.5;">
            {{ proc.description }}
          </p>
        </div>

        <!-- Launch Button -->
        <button type="button" (click)="startWalkthrough(proc)"
                style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--ion-color-danger); background: linear-gradient(135deg, rgba(235,68,90,0.08), rgba(235,68,90,0.02)); color: var(--ion-color-danger); font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all 0.15s ease;">
          <app-icon name="play" [size]="13" color="var(--ion-color-danger)"></app-icon>
          <span>Start Walkthrough ({{ getStepCount(proc) }} Steps)</span>
        </button>
      </div>
    </div>
  </div>

</div>
