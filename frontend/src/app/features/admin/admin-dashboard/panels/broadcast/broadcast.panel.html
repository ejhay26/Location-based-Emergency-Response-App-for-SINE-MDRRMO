<div style="width:100%;">
  <ion-card color="light" style="margin: 0; box-shadow: none; border: 1px solid var(--ion-color-step-150, rgba(0,0,0,0.04));">
    <ion-card-header><ion-card-title style="font-weight: bold; font-size: 16px;">Send Alert</ion-card-title></ion-card-header>
    <ion-card-content>
      <ion-item fill="outline" class="ion-margin-bottom ion-margin-top">
        <ion-input label="Alert Message" labelPlacement="floating" [(ngModel)]="broadcastForm.message" placeholder="e.g. Flood warning in Barangay Pulo..."></ion-input>
      </ion-item>

      <p style="font-size: 12px; font-weight: bold; color: var(--ion-color-medium); margin: 12px 0 8px;">TARGET AUDIENCE</p>
      <div style="display: flex; flex-wrap: wrap; gap: 6px;">
        <button (click)="selectTownWide()"
          [style.background]="isTownWide ? 'var(--ion-color-danger)' : 'var(--ion-color-light)'"
          [style.color]="isTownWide ? 'white' : 'var(--ion-text-color)'"
          style="border:none;border-radius:10px;padding:8px 14px;font-weight:bold;cursor:pointer;font-size:13px;transition:all 0.15s;">
          <i class="fa-solid fa-earth-asia" style="margin-right: 6px;"></i>All
        </button>
        <button *ngFor="let b of barangays" (click)="toggleBarangay(b.id)"
          [style.background]="isBarangaySelected(b.id) ? 'var(--ion-color-danger)' : 'var(--ion-color-light)'"
          [style.color]="isBarangaySelected(b.id) ? 'white' : 'var(--ion-text-color)'"
          style="border:none;border-radius:10px;padding:8px 14px;font-weight:bold;cursor:pointer;font-size:13px;transition:all 0.15s;">
          {{ b.name }}
        </button>
      </div>
      <p style="font-size: 11px; color: var(--ion-color-medium); margin: 8px 0 0;">
        <i class="fa-solid fa-circle-info" style="margin-right: 4px;"></i>
        {{ isTownWide ? 'This alert will be sent to every citizen.' : 'Tap "Town-wide" to clear barangay selection.' }}
      </p>

      <ion-button expand="block" color="danger" (click)="submitBroadcast()"
        [class.btn-muted]="!broadcastForm.message && !isBroadcasting"
        [class.btn-loading]="isBroadcasting"
        style="font-weight: bold; height: 45px; margin-top: 16px;">
        <ng-container *ngIf="!isBroadcasting"><i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> Send Alert</ng-container>
        <span *ngIf="isBroadcasting" class="dot-loader"><span></span><span></span><span></span></span>
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card *ngFor="let broadcast of activeBroadcasts" class="ion-margin-top" style="border: 2px solid var(--ion-color-danger); margin-left: 0; margin-right: 0; box-shadow: none;">
    <ion-card-header style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0;">
      <div>
        <ion-card-subtitle style="font-weight: bold; color: var(--ion-color-danger);">Active Alert</ion-card-subtitle>
        <p style="margin: 4px 0 0; font-size: 11px; font-weight: bold; color: var(--ion-color-medium);">
          <i class="fa-solid fa-location-dot" style="margin-right: 4px;"></i>{{ broadcast.location }}
        </p>
      </div>
      <ion-button fill="clear" color="medium" size="small" (click)="endBroadcast(broadcast)" style="font-weight: bold;"><i class="fa-solid fa-circle-stop" style="margin-right: 6px;"></i> Stop Alert</ion-button>
    </ion-card-header>
    <ion-card-content>
      <h3 style="color: var(--ion-color-danger); font-weight: bold; margin-bottom: 5px;">{{ broadcast.message }}</h3>
      <p style="font-size: 11px; color: var(--ion-color-medium);">Sent: {{ broadcast.created_at | utcDate:'medium' }}</p>
    </ion-card-content>
  </ion-card>
</div>
