<input id="profileGalleryInput" type="file" accept="image/jpeg,image/png,image/webp" style="display:none;" (change)="onPhotoFileSelected($event)" />
<input id="profileCameraInput" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" style="display:none;" (change)="onPhotoFileSelected($event)" />

<div id="tour-avatar-area" [class.tour-highlight]="tour.targetId() === 'tour-avatar-area'" class="ion-text-center ion-margin-vertical">
  <div style="width:120px;height:120px;margin:0 auto;border-radius:50%;overflow:hidden;border:4px solid var(--ion-color-danger);background:var(--ion-color-light);display:flex;align-items:center;justify-content:center;">
    <img *ngIf="resolvedAvatarUrl" [src]="resolvedAvatarUrl" style="width:100%;height:100%;object-fit:cover;" />
    <i *ngIf="!resolvedAvatarUrl" class="fa-solid fa-circle-user" style="font-size:80px;color:var(--ion-color-medium);"></i>
  </div>
  <ion-button fill="clear" color="danger" size="small" class="ion-margin-top" (click)="triggerPhotoPicker()" style="font-weight:bold;"><i class="fa-solid fa-camera" style="margin-right:6px;"></i> Change Photo</ion-button>
</div>

<ion-modal [isOpen]="showCropper" [backdropDismiss]="false">
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar color="danger">
        <ion-title style="color:white;font-weight:bold;">Crop Profile Photo</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding" style="text-align:center;">
      <p style="font-size: 13px; color: gray; margin-bottom: 12px;">Pinch or drag to position your avatar photo.</p>
      <image-cropper [imageFile]="cropperFile || undefined" [maintainAspectRatio]="true" [aspectRatio]="1" format="jpeg" [output]="'base64'" (imageCropped)="onPhotoCropped($event)" style="max-height:60vh;"></image-cropper>

      <!-- Bottom Action Controls: Cancel, Reselect / Retake, Use This Photo -->
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <ion-button fill="outline" color="medium" (click)="cancelCrop()" style="flex: 1; font-weight: bold; height: 46px; border-radius: 10px;">
          <i class="fa-solid fa-xmark" style="margin-right: 6px;"></i> Cancel
        </ion-button>
        <ion-button fill="outline" color="danger" (click)="triggerPhotoPicker()" style="flex: 1.2; font-weight: bold; height: 46px; border-radius: 10px;">
          <i class="fa-solid fa-images" style="margin-right: 6px;"></i> Reselect
        </ion-button>
        <ion-button color="danger" (click)="confirmCrop()" [class.btn-loading]="isCropping" style="flex: 1.4; font-weight: bold; height: 46px; border-radius: 10px;">
          <ng-container *ngIf="!isCropping"><i class="fa-solid fa-check" style="margin-right: 6px;"></i> Use Photo</ng-container>
          <span *ngIf="isCropping" class="dot-loader"><span></span><span></span><span></span></span>
        </ion-button>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
