<div id="report-map-card" [class.is-fullscreen]="mapExpanded">
  <!-- Map container: NEVER moved or reparented in DOM -->
  <div id="report-map" style="width:100%;height:100%;position:relative;"></div>

  <!-- Center Crosshairs -->
  <div class="map-center-crosshairs">
    <i class="fa-solid fa-crosshairs" [style.color]="crosshairColor"></i>
  </div>

  <!-- Live resolved barangay badge (top-left) -->
  <div *ngIf="resolvedBarangayName" class="map-bgy-badge">
    <i class="fa-solid fa-location-dot"></i>
    <span>{{ resolvedBarangayName }}</span>
  </div>

  <!-- Drag hint (bottom/top center) -->
  <div *ngIf="showMapHint" class="map-drag-hint-badge">
    <i class="fa-solid fa-arrows-up-down-left-right"></i>
    <span>Drag map to move pin</span>
  </div>

  <!-- Expand / Compress Button (top-right) -->
  <button type="button" (click)="toggleMapExpand()" class="map-expand-toggle-btn" [attr.aria-label]="mapExpanded ? 'Exit full screen map' : 'Open full screen map'">
    <i [class]="mapExpanded ? 'fa-solid fa-compress' : 'fa-solid fa-expand'"></i>
  </button>

  <!-- Fullscreen Floating Controls (Only shown when expanded) -->
  <ng-container *ngIf="mapExpanded">
    <!-- Floating 'Use My Location' button -->
    <button type="button" (click)="getCurrentLocation()" class="map-fs-loc-btn">
      <i class="fa-solid fa-location-crosshairs" style="color:var(--ion-color-danger,#eb445a);"></i>
      <span>Use My Location</span>
    </button>

    <!-- Floating Submit button -->
    <div *ngIf="submitLabel" class="map-fs-submit-container">
      <button type="button" appPressFeedback [disabled]="submitDisabled" (click)="submitRequested.emit()"
        [style.background]="submitLoading ? '#666' : (submitDisabled ? '#888' : (reportType === 'hazard' ? 'var(--ion-color-warning,#ffc409)' : 'var(--ion-color-danger,#eb445a)'))"
        [style.cursor]="submitDisabled ? 'not-allowed' : 'pointer'"
        class="map-fs-submit-btn">
        <ng-container *ngIf="!submitLoading">
          <i [class]="reportType === 'hazard' ? 'fa-solid fa-road-barrier' : 'fa-solid fa-triangle-exclamation'"></i>
          {{ submitLabel }}
        </ng-container>
        <span *ngIf="submitLoading" class="dot-loader"><span></span><span></span><span></span></span>
      </button>
    </div>

    <!-- Fullscreen Top/Bottom Street | Satellite bar -->
    <div class="map-fs-bottom-bar">
      <div class="map-style-btn-group">
        <button type="button" (click)="toggleMapStyle('street')" [class.active]="mapStyle==='street'"><i class="fa-solid fa-map"></i> Street</button>
        <button type="button" (click)="toggleMapStyle('satellite')" [class.active]="mapStyle==='satellite'"><i class="fa-solid fa-satellite"></i> Satellite</button>
      </div>
    </div>
  </ng-container>
</div>

<!-- Inline Street | Satellite bar (Only shown when not expanded) -->
<div *ngIf="!mapExpanded" style="display:flex;border-radius:10px;overflow:hidden;margin-bottom:14px;border:2px solid var(--ion-color-step-150,#ddd);">
  <button type="button" (click)="toggleMapStyle('street')" [style.background]="mapStyle==='street'?'var(--ion-color-danger)':'var(--ion-color-light)'" [style.color]="mapStyle==='street'?'white':'var(--ion-text-color)'" style="flex:1;border:none;padding:11px 8px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.2s;"><i class="fa-solid fa-map"></i> Street</button>
  <button type="button" (click)="toggleMapStyle('satellite')" [style.background]="mapStyle==='satellite'?'var(--ion-color-danger)':'var(--ion-color-light)'" [style.color]="mapStyle==='satellite'?'white':'var(--ion-text-color)'" style="flex:1;border:none;padding:11px 8px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.2s;border-left:2px solid var(--ion-color-step-150,#ddd);"><i class="fa-solid fa-satellite"></i> Satellite</button>
</div>
