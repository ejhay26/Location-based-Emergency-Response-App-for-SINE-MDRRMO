<div *ngIf="canAddMore" id="tour-media-buttons" [class.tour-highlight]="tour.targetId() === 'tour-media-buttons'" style="display:flex;gap:8px;margin-bottom:14px;">
  <ion-button type="button" expand="block" color="dark" style="flex:1;font-weight:bold;height:45px;" (click)="takePhoto()"><i class="fa-solid fa-camera" style="margin-right:6px;"></i> Photo</ion-button>
  <ion-button type="button" expand="block" color="dark" fill="outline" style="flex:1;font-weight:bold;height:45px;" (click)="triggerVideo()"><i class="fa-solid fa-video" style="margin-right:6px;"></i> Video (≤10s)</ion-button>
</div>
<div *ngIf="mediaFiles.length > 0" style="text-align:center;font-size:12px;color:gray;margin-bottom:10px;">{{ mediaFiles.length }} of 2 files attached<span *ngIf="!canAddMore" style="color:#ffc409;font-weight:bold;"> — Maximum reached</span></div>
<div *ngIf="mediaFiles.length > 0" style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
  <div *ngFor="let media of mediaFiles; let i = index" style="position:relative;flex:1;min-width:120px;">
    <img *ngIf="media.type==='photo'" [src]="media.preview" style="width:100%;max-height:140px;object-fit:cover;border-radius:10px;border:2px solid var(--ion-color-danger);" />
    <video *ngIf="media.type==='video'" [src]="media.preview" controls playsinline style="width:100%;max-height:140px;border-radius:10px;border:2px solid var(--ion-color-danger);"></video>
    <button type="button" (click)="removeMedia(i)" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.65);border:none;border-radius:50%;width:26px;height:26px;color:white;font-size:13px;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>
<input id="videoInput" type="file" accept="video/*" capture="environment" style="display:none;" (change)="onVideoSelected($event)" />

<ion-modal [isOpen]="showCropper" [backdropDismiss]="false">
  <ng-template>
    <ion-header class="ion-no-border"><ion-toolbar [color]="reportType==='hazard'?'warning':'danger'"><ion-title style="color:white;font-weight:bold;">Crop Photo</ion-title><ion-buttons slot="end"><ion-button (click)="cancelCrop()" style="color:white;font-weight:bold;">Cancel</ion-button></ion-buttons></ion-toolbar></ion-header>
    <ion-content class="ion-padding" style="text-align:center;">
      <image-cropper [imageFile]="cropperFile || undefined" [maintainAspectRatio]="false" format="jpeg" [output]="'base64'" (imageCropped)="onPhotoCropped($event)" style="max-height:60vh;"></image-cropper>
      <ion-button expand="block" [color]="reportType==='hazard'?'warning':'danger'" (click)="confirmCrop()" style="font-weight:bold;height:48px;margin-top:16px;"><i class="fa-solid fa-crop-simple" style="margin-right:8px;"></i> Use This Crop</ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
