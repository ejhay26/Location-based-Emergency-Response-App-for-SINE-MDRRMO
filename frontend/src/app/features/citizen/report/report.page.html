<ion-header class="ion-no-border">
  <ion-toolbar [color]="reportType === 'hazard' ? undefined : 'danger'"
               [style.--background]="reportType === 'hazard' ? 'linear-gradient(180deg, #f59e0b 0%, #d97706 100%)' : 'var(--ion-color-danger, #d32f2f)'"
               style="color: #ffffff;">
    <ion-buttons slot="start">
      <ion-button (click)="close()" style="--color: #ffffff; color: #ffffff; font-weight: 700; font-size: 16px; --padding-start: 4px;">
        <app-icon name="chevron-left" [size]="20" color="#ffffff" style="margin-right: 2px;"></app-icon>
        <span style="color: #ffffff;">Back</span>
      </ion-button>
    </ion-buttons>
    <ion-title style="color: #ffffff; font-weight: 800; font-size: 17px;">{{ reportType === 'hazard' ? 'Report Hazard' : 'Send Emergency SOS' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--padding-bottom: 96px;">
  <form #reportFormEl [formGroup]="reportForm" (ngSubmit)="submitReport()">
    <app-report-type-selector
      [reportType]="reportType"
      (incidentTypeChange)="reportForm.patchValue({ incident_type_id: $event })"
      (hazardTypeChange)="reportForm.patchValue({ hazard_type: $event })">
    </app-report-type-selector>

    <div class="inset-card" style="padding:16px;margin:0 0 20px 0;">
      <ion-item fill="outline" style="margin-bottom:8px;--border-radius:14px;">
        <ion-textarea id="tour-description-field" [class.tour-highlight]="tour.targetId() === 'tour-description-field'" [label]="reportType==='emergency' ? 'Additional Details (optional)' : 'Describe the hazard (required)'" labelPlacement="stacked" formControlName="description" [rows]="3" [placeholder]="reportType==='emergency' ? 'Tap here to describe the situation…' : 'Tap here to describe the hazard…'"></ion-textarea>
      </ion-item>

      <app-report-media
        [reportType]="reportType"
        (mediaFilesChange)="mediaFiles = $event">
      </app-report-media>

      <div id="tour-map-area" [class.tour-highlight]="tour.targetId() === 'tour-map-area'">
        <app-report-map
          [reportType]="reportType"
          [submitLabel]="reportType === 'hazard' ? 'Submit Hazard Report' : 'Send Emergency SOS'"
          [submitDisabled]="!isFormReady || isSubmitting"
          [submitLoading]="isSubmitting"
          (coordsChanged)="onCoordsChanged($event)"
          (submitRequested)="submitReport()">
        </app-report-map>

        <div style="display:flex;gap:10px;margin-top:6px;">
          <div style="flex:1;background:var(--ion-color-step-50, rgba(0,0,0,0.03));border:1px solid var(--ion-color-step-100, rgba(0,0,0,0.06));border-radius:14px;padding:8px 12px;">
            <p style="margin:0;font-size:10px;font-weight:700;color:var(--ion-color-medium);text-transform:uppercase;letter-spacing:0.5px;">Latitude</p>
            <p style="margin:2px 0 0;font-size:14px;font-weight:700;color:var(--ion-text-color);font-family:monospace;">{{ reportForm.get('latitude')?.value || '—' }}</p>
          </div>
          <div style="flex:1;background:var(--ion-color-step-50, rgba(0,0,0,0.03));border:1px solid var(--ion-color-step-100, rgba(0,0,0,0.06));border-radius:14px;padding:8px 12px;">
            <p style="margin:0;font-size:10px;font-weight:700;color:var(--ion-color-medium);text-transform:uppercase;letter-spacing:0.5px;">Longitude</p>
            <p style="margin:2px 0 0;font-size:14px;font-weight:700;color:var(--ion-text-color);font-family:monospace;">{{ reportForm.get('longitude')?.value || '—' }}</p>
          </div>
        </div>

        <button type="button" (click)="reportMapCmp?.getCurrentLocation()"
          style="width:100%;height:44px;border:none;border-radius:14px;background:var(--app-red-light, rgba(211,47,47,0.1));color:var(--ion-color-danger);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin:12px 0 0;transition:all 0.15s ease;">
          <app-icon name="map-pin" [size]="16" color="var(--ion-color-danger)"></app-icon> Use My Location
        </button>
      </div>
    </div>
  </form>
</ion-content>

<!-- Docked Bottom Glass Action Bar (Apple HIG Layout) -->
<div *ngIf="!reportMapCmp?.mapExpanded"
     style="position:fixed;bottom:0;left:0;right:0;z-index:8000;padding:12px 16px calc(14px + env(safe-area-inset-bottom, 0px));background:var(--ion-background-color, #ffffff);border-top:var(--inset-divider, 1px solid rgba(0,0,0,0.08));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 -4px 20px rgba(0,0,0,0.05);">
  <ion-button id="tour-submit-button"
              appPressFeedback
              [class.tour-highlight]="tour.targetId() === 'tour-submit-button'"
              [disabled]="!isFormReady || isSubmitting"
              (click)="submitReport()"
              expand="block"
              [color]="reportType === 'hazard' ? undefined : 'danger'"
              [style.--background]="reportType === 'hazard' ? (!isFormReady ? 'var(--ion-color-step-300, #94a3b8)' : 'linear-gradient(180deg, #f59e0b 0%, #d97706 100%)') : undefined"
              [style.--box-shadow]="reportType === 'hazard' && isFormReady ? '0 4px 16px rgba(217, 119, 6, 0.32)' : '0 4px 16px rgba(0,0,0,0.18)'"
              size="large"
              style="font-weight:800;height:52px;--border-radius:16px;margin:0;">
    <ng-container *ngIf="!isSubmitting">
      <app-icon [name]="reportType === 'hazard' ? 'hazard' : 'alert'" [size]="20" color="#ffffff" style="margin-right:8px;"></app-icon>
      <span style="color: #ffffff;">{{ reportType === 'hazard' ? 'Submit Hazard Report' : 'Send Emergency SOS' }}</span>
    </ng-container>
    <span *ngIf="isSubmitting" class="dot-loader dot-loader-white"><span></span><span></span><span></span></span>
  </ion-button>
</div>
