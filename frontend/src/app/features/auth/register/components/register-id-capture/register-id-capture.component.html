<ion-card style="margin: 20px 0 10px 0; border: 2px dashed var(--ion-color-danger); background: transparent;">
  <ion-card-content class="ion-text-center">
    <p style="margin-bottom: 4px; font-weight: 600; color: var(--ion-text-color);">{{ config.title }}</p>
    <p style="font-size: 12px; margin-top: 0 0 12px 0; color: var(--ion-color-medium);">{{ config.description }}</p>
    <div *ngIf="!preview" style="display: flex; gap: 8px; justify-content: center; margin-top: 8px;">
      <ion-button color="danger" fill="solid" (click)="triggerCapture()" style="font-weight: bold;">
        <i [class]="config.buttonIcon" style="margin-right: 8px;"></i> {{ config.buttonLabel }}
      </ion-button>
    </div>
    <div *ngIf="preview" style="margin-top: 10px;">
      <div style="border-radius: 8px; overflow: hidden; border: 2px solid #2dd36f; margin-bottom: 10px;">
        <img [src]="preview" style="max-height: 160px; object-fit: contain; width: 100%; background: #000;" />
      </div>
      <div style="display: flex; gap: 8px; justify-content: center;">
        <ion-button color="medium" fill="outline" size="small" (click)="clearImage()" style="font-weight: bold;">
          <i class="fa-solid fa-rotate" style="margin-right: 6px;"></i> Retake
        </ion-button>
      </div>
    </div>
  </ion-card-content>
</ion-card>

<ion-modal [isOpen]="showCropper" [backdropDismiss]="false">
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar color="danger">
        <ion-title style="color: white; font-weight: bold;">{{ config.modalTitle }}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="cancelCrop()" style="color: white; font-weight: bold;">Cancel</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding" style="text-align: center;">
      <p style="font-size: 13px; color: gray; margin-bottom: 12px;">Drag to reposition. Pinch or use handles to crop.</p>
      <image-cropper
        [imageFile]="rawFile || undefined"
        [maintainAspectRatio]="true"
        [aspectRatio]="16 / 9"
        format="jpeg"
        [output]="'base64'"
        [roundCropper]="false"
        (imageCropped)="onCropped($event)"
        style="max-height: 60vh;">
      </image-cropper>
      <ion-button expand="block" color="success" (click)="confirmCrop()" style="font-weight: bold; height: 48px; margin-top: 16px;">
        <i class="fa-solid fa-crop-simple" style="margin-right: 8px;"></i> Use This Crop
      </ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
