<ng-container *ngIf="visible">
  <div class="sos-pill-stack">
    <div *ngFor="let pill of pills; trackBy: trackByKey"
         appPressFeedback
         (click)="onTap()"
         class="sos-pill"
         [class.sos-pill--offline]="pill.state === 'offline'"
         [class.sos-pill--dispatched]="pill.state === 'dispatched'"
         role="button"
         tabindex="0">

      <div class="sos-pill__icon-wrap">
        <app-icon [name]="pill.icon" [size]="18" [color]="pill.state === 'dispatched' ? '#3880ff' : (pill.state === 'offline' ? '#e0ac00' : 'var(--ion-color-danger)')"></app-icon>
      </div>

      <div class="sos-pill__body">
        <p class="sos-pill__label">{{ pill.label }}</p>
        <p class="sos-pill__sublabel">{{ pill.sublabel }}</p>
      </div>

      <div class="sos-pill__right">
        <span *ngIf="pill.timeAgo" class="sos-pill__time">{{ pill.timeAgo }}</span>

        <!-- Cancel button — only on cancellable pills (Pending + offline queue) -->
        <button *ngIf="pill.cancellable"
                class="sos-pill__cancel-action-btn"
                (touchstart)="$event.stopPropagation()"
                (touchend)="$event.stopPropagation()"
                (mousedown)="$event.stopPropagation()"
                (click)="onCancel($event, pill)"
                aria-label="Cancel this SOS report">
          <app-icon name="close" [size]="12"></app-icon>
          <span>Cancel</span>
        </button>

        <!-- Chevron only on non-cancellable pills (Dispatched) — tap goes to History -->
        <app-icon *ngIf="!pill.cancellable" name="chevron-right" [size]="14" class="sos-pill__chevron"></app-icon>
      </div>
    </div>
  </div>
</ng-container>
