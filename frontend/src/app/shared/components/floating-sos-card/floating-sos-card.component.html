<ng-container *ngIf="visible">
  <div class="sos-pill-stack">
    <div *ngFor="let pill of pills; trackBy: trackByKey"
         appPressFeedback
         (click)="onTap()"
         class="sos-pill"
         [class.sos-pill--offline]="pill.state === 'offline'"
         [class.sos-pill--pending]="pill.state === 'pending'"
         [class.sos-pill--dispatched]="pill.state === 'dispatched'"
         role="button"
         tabindex="0">

      <!-- Left State Beacon / Icon Badge -->
      <div class="sos-pill__icon-wrap">
        <span class="sos-pill__pulse" *ngIf="pill.state === 'pending' || pill.state === 'dispatched'"></span>
        <app-icon [name]="pill.icon" [size]="18" [color]="pill.state === 'dispatched' ? '#10b981' : (pill.state === 'offline' ? '#f59e0b' : '#d32f2f')"></app-icon>
      </div>

      <!-- Center Title & Status Description -->
      <div class="sos-pill__body">
        <div class="sos-pill__header-row">
          <span class="sos-pill__live-indicator" *ngIf="pill.state === 'dispatched'">DISPATCHED</span>
          <span class="sos-pill__pending-indicator" *ngIf="pill.state === 'pending'">PENDING</span>
          <p class="sos-pill__label">{{ pill.label }}</p>
        </div>
        <p class="sos-pill__sublabel">{{ pill.sublabel }}</p>
      </div>

      <!-- Right Action & Timestamp -->
      <div class="sos-pill__right">
        <span *ngIf="pill.timeAgo" class="sos-pill__time">{{ pill.timeAgo }}</span>

        <!-- Cancel button — Apple capsule style -->
        <button *ngIf="pill.cancellable"
                type="button"
                class="sos-pill__cancel-action-btn"
                (touchstart)="$event.stopPropagation()"
                (touchend)="$event.stopPropagation()"
                (mousedown)="$event.stopPropagation()"
                (click)="onCancel($event, pill)"
                aria-label="Cancel this SOS report">
          <app-icon name="close" [size]="11" color="var(--ion-color-danger, #d32f2f)"></app-icon>
          <span>Cancel</span>
        </button>

        <!-- Chevron for dispatched (tappable) -->
        <app-icon *ngIf="!pill.cancellable" name="chevron-right" [size]="14" class="sos-pill__chevron"></app-icon>
      </div>
    </div>
  </div>
</ng-container>
