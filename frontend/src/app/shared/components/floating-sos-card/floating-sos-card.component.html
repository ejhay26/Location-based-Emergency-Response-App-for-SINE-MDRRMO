<ng-container *ngIf="visible">
  <!-- Minimized Floating Beacon Pill (Left Edge) -->
  <div *ngIf="isMinimized"
       class="sos-minimized-beacon"
       (click)="expandCard()"
       role="button"
       tabindex="0"
       aria-label="Expand Emergency SOS Status">
    <div class="beacon-icon-wrap" [class.is-dispatched]="pills[0]?.state === 'dispatched'">
      <span class="beacon-pulse"></span>
      <app-icon [name]="pills[0]?.icon || 'alert'" [size]="16" [color]="pills[0]?.state === 'dispatched' ? '#10b981' : '#d32f2f'"></app-icon>
    </div>
    <span class="beacon-label">{{ pills[0]?.state === 'dispatched' ? 'En Route' : 'SOS Active' }}</span>
    <div class="beacon-chevron-box">
      <app-icon name="chevron-forward" [size]="14" color="var(--ion-color-medium, #8e8e93)"></app-icon>
    </div>
  </div>

  <!-- Expanded Floating SOS Card Stack -->
  <div *ngIf="!isMinimized" class="sos-pill-stack">
    <div *ngFor="let pill of pills; trackBy: trackByKey"
         (click)="onTap()"
         class="sos-pill"
         [class.sos-pill--offline]="pill.state === 'offline'"
         [class.sos-pill--pending]="pill.state === 'pending'"
         [class.sos-pill--dispatched]="pill.state === 'dispatched'"
         role="button"
         tabindex="0">

      <!-- Left State Beacon / Icon Badge -->
      <div class="sos-pill__icon-wrap">
        <span class="sos-pill__pulse" *ngIf="pill.state === 'pending' || pill.state === 'dispatched'"></span>
        <app-icon [name]="pill.icon" [size]="18" [color]="pill.state === 'dispatched' ? '#10b981' : (pill.state === 'offline' ? '#f59e0b' : '#d32f2f')"></app-icon>
      </div>

      <!-- Center Title & Status Description -->
      <div class="sos-pill__body">
        <div class="sos-pill__header-row">
          <span class="sos-pill__live-indicator" *ngIf="pill.state === 'dispatched'">DISPATCHED</span>
          <span class="sos-pill__pending-indicator" *ngIf="pill.state === 'pending'">PENDING</span>
          <span *ngIf="pill.timeAgo" class="sos-pill__time-header">{{ pill.timeAgo }}</span>
          <p class="sos-pill__label">{{ pill.label }}</p>
        </div>
        <p class="sos-pill__sublabel">{{ pill.sublabel }}</p>
      </div>

      <!-- Right Action & Enlarged Quick Minimize Button -->
      <div class="sos-pill__right">
        <!-- Cancel button — Apple capsule style -->
        <button *ngIf="pill.cancellable"
                type="button"
                class="sos-pill__cancel-action-btn"
                (pointerdown)="$event.stopPropagation()"
                (touchstart)="$event.stopPropagation()"
                (touchend)="$event.stopPropagation()"
                (mousedown)="$event.stopPropagation()"
                (click)="onCancel($event, pill)"
                aria-label="Cancel this SOS report">
          <app-icon name="close" [size]="11" color="var(--ion-color-danger, #d32f2f)"></app-icon>
          <span>Cancel</span>
        </button>

        <!-- Chevron for dispatched (tappable) -->
        <app-icon *ngIf="!pill.cancellable" name="chevron-forward" [size]="14" class="sos-pill__chevron"></app-icon>

        <!-- Enlarged Minimize Button at the Far Right -->
        <button type="button"
                class="sos-pill__minimize-btn"
                (pointerdown)="$event.stopPropagation()"
                (touchstart)="$event.stopPropagation()"
                (touchend)="$event.stopPropagation()"
                (mousedown)="$event.stopPropagation()"
                (click)="minimizeCard($event)"
                aria-label="Minimize SOS Card"
                title="Minimize">
          <app-icon name="chevron-back" [size]="16"></app-icon>
        </button>
      </div>
    </div>
  </div>
</ng-container>
