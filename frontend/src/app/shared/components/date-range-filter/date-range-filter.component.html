<ion-button [id]="triggerId" [fill]="hasValue ? 'solid' : 'outline'" [color]="hasValue ? 'danger' : 'medium'" size="small"
  style="font-weight:700;--border-radius:20px;height:32px;margin:0;white-space:nowrap;font-size:12px;--padding-start:12px;--padding-end:12px;">
  <i class="fa-solid fa-calendar-days" style="margin-right:5px;font-size:11px;"></i>{{ displayLabel }}
</ion-button>

<ion-popover [trigger]="triggerId" [dismissOnSelect]="false" side="bottom" alignment="center" (didPresent)="onOpen()"
  style="--width:min(340px, 92vw);">
  <ng-template>
    <div style="padding:12px;width:100%;box-sizing:border-box;">
      <ion-segment [value]="pendingMode" (ionChange)="onModeChange($event)" style="margin-bottom:10px;">
        <ion-segment-button value="single"><ion-label style="font-size:10.5px;white-space:normal;text-transform:none;line-height:1.15;">One Day</ion-label></ion-segment-button>
        <ion-segment-button value="multiple"><ion-label style="font-size:10.5px;white-space:normal;text-transform:none;line-height:1.15;">Several Days</ion-label></ion-segment-button>
        <ion-segment-button value="range"><ion-label style="font-size:10.5px;white-space:normal;text-transform:none;line-height:1.15;">Date Range</ion-label></ion-segment-button>
      </ion-segment>

      <p *ngIf="pendingMode === 'multiple'" style="font-size:11px;color:var(--ion-color-medium);margin:0 2px 6px;">Tap as many days as you need.</p>
      <p *ngIf="pendingMode === 'range'" style="font-size:11px;color:var(--ion-color-medium);margin:0 2px 6px;">
        <ng-container *ngIf="!pendingRangeStart">Tap a Start day, then an End day.</ng-container>
        <ng-container *ngIf="pendingRangeStart && !pendingRangeEnd">Start: {{ pendingRangeStart }} - now tap an End day.</ng-container>
        <ng-container *ngIf="pendingRangeStart && pendingRangeEnd">{{ pendingRangeStart }} to {{ pendingRangeEnd }}</ng-container>
      </p>

      <!-- One persistent calendar for all three modes - see component doc for how
           mode-switches, reopening, and clearing all reset it via reset() rather
           than unmounting it (which previously caused a visible flash). -->
      <ion-datetime
        presentation="date"
        size="cover"
        [multiple]="isMultipleCalendar"
        [value]="calendarValue"
        [highlightedDates]="pendingMode === 'range' ? rangeHighlight : undefined"
        (ionChange)="onCalendarChange($event)">
      </ion-datetime>

      <div style="display:flex;gap:8px;margin-top:14px;">
        <ion-button fill="clear" color="medium" size="small" style="flex:1;margin:0;font-weight:bold;" (click)="onClear()">Clear</ion-button>
        <ion-button color="danger" size="small" style="flex:1;margin:0;font-weight:bold;" [disabled]="!canApply" (click)="onApply()">Apply</ion-button>
      </div>
    </div>
  </ng-template>
</ion-popover>
