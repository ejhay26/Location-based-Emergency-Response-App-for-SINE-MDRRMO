<button
  type="button"
  [id]="triggerId"
  class="mac-popover-btn date-range-btn"
  [class.has-filter]="hasValue"
  [title]="displayLabel">
  <app-icon name="calendar" [size]="13" [color]="hasValue ? 'var(--ion-color-danger, #eb445a)' : 'currentColor'"></app-icon>
  <span class="btn-text">{{ displayLabel }}</span>
  <span *ngIf="hasValue" class="mac-filter-clear-x" (click)="onClearTrigger($event)" title="Reset Date Filter">
    <app-icon name="close" [size]="9" color="#ffffff"></app-icon>
  </span>
</button>

<ion-popover [trigger]="triggerId" [dismissOnSelect]="false" side="bottom" alignment="center" (didPresent)="onOpen()"
  style="--width: 360px; --min-width: 330px; --max-width: 95vw; --background: var(--ion-card-background, #1c1c1e); --border-radius: 16px; --box-shadow: 0 16px 40px rgba(0,0,0,0.45);">
  <ng-template>
    <div style="padding: 14px 12px 12px; width: 100%; box-sizing: border-box; background: var(--ion-card-background, #ffffff); border: var(--card-border, 1px solid rgba(255,255,255,0.15)); border-radius: 16px;">
      <ion-segment mode="ios" [value]="pendingMode" (ionChange)="onModeChange($event)" style="margin-bottom:12px;">
        <ion-segment-button value="single"><ion-label style="font-size:11px;font-weight:700;">One Day</ion-label></ion-segment-button>
        <ion-segment-button value="multiple"><ion-label style="font-size:11px;font-weight:700;">Several Days</ion-label></ion-segment-button>
        <ion-segment-button value="range"><ion-label style="font-size:11px;font-weight:700;">Date Range</ion-label></ion-segment-button>
      </ion-segment>

      <p *ngIf="pendingMode === 'multiple'" style="font-size:11.5px;color:var(--ion-color-medium);margin:0 4px 8px;font-weight:500;">Tap as many days as you need.</p>
      <p *ngIf="pendingMode === 'range'" style="font-size:11.5px;color:var(--ion-color-medium);margin:0 4px 8px;font-weight:500;">
        <ng-container *ngIf="!pendingRangeStart">Tap a Start day, then an End day.</ng-container>
        <ng-container *ngIf="pendingRangeStart && !pendingRangeEnd">Start: {{ pendingRangeStart }} — now tap an End day.</ng-container>
        <ng-container *ngIf="pendingRangeStart && pendingRangeEnd">{{ pendingRangeStart }} to {{ pendingRangeEnd }}</ng-container>
      </p>

      <!-- One persistent calendar for all three modes -->
      <div style="border-radius:14px;overflow:hidden;background:var(--ion-color-step-50, rgba(0,0,0,0.03));border:1px solid var(--ion-color-step-150, rgba(0,0,0,0.08));">
        <ion-datetime
          presentation="date"
          style="width: 100%; min-width: 300px; --background: transparent;"
          [max]="max ?? undefined"
          [multiple]="isMultipleCalendar"
          [value]="calendarValue"
          [highlightedDates]="pendingMode === 'range' ? rangeHighlight : undefined"
          (ionChange)="onCalendarChange($event)">
        </ion-datetime>
      </div>

      <div style="display:flex;gap:10px;margin-top:14px;">
        <ion-button fill="outline" color="medium" size="small" style="flex:1;margin:0;font-weight:700;height:38px;--border-radius:12px;" (click)="onClear()">Clear</ion-button>
        <ion-button color="danger" size="small" style="flex:1;margin:0;font-weight:700;height:38px;--border-radius:12px;--box-shadow:0 4px 12px rgba(211,47,47,0.3);" [disabled]="!canApply" (click)="onApply()">Apply</ion-button>
      </div>
    </div>
  </ng-template>
</ion-popover>
