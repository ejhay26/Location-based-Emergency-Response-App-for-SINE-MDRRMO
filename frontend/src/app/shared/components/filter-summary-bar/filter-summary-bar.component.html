<div *ngIf="isActive"
  style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ion-color-step-50,rgba(0,0,0,0.035));border:1px solid var(--ion-color-step-150,rgba(0,0,0,0.08));border-radius:14px;padding:8px 12px;margin-bottom:14px;">
  <app-icon name="settings" [size]="14" color="var(--ion-color-danger)" style="flex-shrink:0;"></app-icon>
  <span style="font-size:12px;font-weight:700;color:var(--ion-color-medium);flex-shrink:0;">Filtered by:</span>
  <span *ngFor="let chip of chips"
    style="background:var(--ion-color-danger);color:white;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap;">{{ chip }}</span>
  <ion-button fill="clear" color="medium" size="small" style="margin:0 0 0 auto;font-weight:700;height:26px;flex-shrink:0;" (click)="clearAll.emit()">
    <app-icon name="close" [size]="12" style="margin-right:4px;"></app-icon>Clear all
  </ion-button>
</div>
