<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>MDRRMO EMERGENCY RESPONSE APP</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/logo.jpg" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <style>
    /* ── Immediate First-Paint Splash Screen ──────────────────────────────── */
    #sine-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100vh + 120px);
      background: radial-gradient(circle at 50% 38%, #0f172a 0%, #060a14 100%);
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: all;
      /* Downward convex arc at bottom */
      clip-path: ellipse(140% 100% at 50% 0%);
      will-change: transform, clip-path, opacity;
      transform: translateZ(0);
    }

    #sine-splash.splash-dismiss {
      animation: splashArcFlyUp 720ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: none;
    }

    @keyframes splashArcFlyUp {
      0% {
        transform: translateY(0);
        clip-path: ellipse(140% 100% at 50% 0%);
      }
      35% {
        clip-path: ellipse(120% 95% at 50% -5%);
      }
      100% {
        transform: translateY(-115%);
        clip-path: ellipse(105% 90% at 50% -10%);
        opacity: 0.98;
      }
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      margin-top: -60px;
    }

    .splash-badge {
      position: relative;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.04) 100%);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 28px rgba(211, 47, 47, 0.28);
      margin-bottom: 20px;
    }

    .splash-logo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .splash-headers {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .splash-org {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin-bottom: 6px;
    }

    .splash-title {
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.02em;
      margin: 0 0 6px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .splash-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .splash-progress-track {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }

    .splash-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #D32F2F, #EF5350);
      border-radius: 999px;
      animation: splashIndeterminate 1.4s infinite ease-in-out;
    }

    @keyframes splashIndeterminate {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 35%;
        width: 50%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }

    .splash-status-text {
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 0.02em;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>

<body>
  <div id="sine-splash">
    <div class="splash-content">
      <div class="splash-badge">
        <img src="assets/icon/logo.jpg" alt="MDRRMO SINE" class="splash-logo" />
      </div>
      <div class="splash-headers">
        <span class="splash-org">MUNICIPALITY OF SAN ISIDRO</span>
        <h1 class="splash-title">MDRRMO EMERGENCY RESPONSE</h1>
        <p class="splash-subtitle">San Isidro, Nueva Ecija</p>
      </div>
      <div class="splash-progress-track">
        <div class="splash-progress-fill"></div>
      </div>
      <span class="splash-status-text">Getting things ready...</span>
    </div>
  </div>

  <app-root></app-root>
</body>

</html>
