// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Kotlin 2.1.0: required for the ReportWidgetProvider (Stage 3a home screen
// widget). Verified compatible with AGP 8.13.0 / Gradle 8.14.3. Declared
// here via the modern plugins{} DSL (apply false) rather than as a
// buildscript classpath — having it in BOTH places at once is what caused
// "InvalidPluginRequestException: plugin already on the classpath with a
// different version". app/build.gradle applies it without a version,
// matching the existing pattern already used for google-services below.
plugins {
  id 'com.google.gms.google-services' version '4.5.0' apply false
  id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

