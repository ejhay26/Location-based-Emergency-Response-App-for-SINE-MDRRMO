networks:
  mdrrmo_net:
    driver: bridge

services:
  # ── Redis In-Memory Cache & Queue ─────────────────────────────────────
  redis:
    image: docker.io/library/redis:alpine
    container_name: mdrrmo_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "s1ne_mdrrm0_red1s_2026"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./docker/data/redis:/data:Z
    networks:
      - mdrrmo_net

  app:
    build: .
    image: localhost/backend_app:latest
    container_name: mdrrmo_backend
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - redis
      - reverb
    ports:
      - "80:80"
    env_file:
      - .env
      - path: .env.local
        required: false
    networks:
      - mdrrmo_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    volumes:
      - ./app:/var/www/html/app:Z
      - ./routes:/var/www/html/routes:Z
      - ./config:/var/www/html/config:Z
      - ./database:/var/www/html/database:Z
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:Z
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-app.ini:Z
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:Z
      - ./docker/cache/tiles:/var/cache/nginx/tiles:Z
      - ./storage:/var/www/html/storage:Z

  # ── Laravel Reverb WebSocket server ────────────────────────────────────
  reverb:
    build: .
    image: localhost/backend_app:latest
    container_name: mdrrmo_reverb
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - redis
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=6001"]
    ports:
      - "6001:6001"
    env_file:
      - .env
      - path: .env.local
        required: false
    networks:
      - mdrrmo_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    volumes:
      - ./app:/var/www/html/app:Z
      - ./routes:/var/www/html/routes:Z
      - ./config:/var/www/html/config:Z
      - ./database:/var/www/html/database:Z
      - ./storage:/var/www/html/storage:Z
