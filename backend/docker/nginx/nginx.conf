user nginx;
worker_processes auto;
worker_rlimit_nofile 65536;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 8192; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    client_max_body_size 22M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # ── Map Tile Disk Cache ───────────────────────────────────────────────
    # Caches OpenStreetMap and satellite tiles on the VPS disk.
    # Eliminates client rate-limiting, IP blocks, and internet latency.
    # 5GB max size with 60-day retention and atomic lock protection.
    proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles_cache:50m max_size=5g inactive=60d;

    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # ── Map Tile Proxy & Cache (OpenStreetMap) ────────────────────────
        # Intercepts /tiles/osm/{z}/{x}/{y}.png and /api/tiles/osm/{z}/{x}/{y}.png
        location ~* ^/(?:api/)?tiles/osm/(\d+)/(\d+)/(\d+)\.png$ {
            set $tile_z $1;
            set $tile_x $2;
            set $tile_y $3;

            proxy_pass https://tile.openstreetmap.org/$tile_z/$tile_x/$tile_y.png;
            proxy_set_header Host tile.openstreetmap.org;
            proxy_set_header User-Agent "SINE-MDRRMO-Emergency-Response-App/1.0 (contact: admin@sine-mdrrmo.gov.ph)";
            proxy_set_header Referer "https://www.openstreetmap.org/";
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_cache tiles_cache;
            proxy_cache_key "osm-$tile_z-$tile_x-$tile_y";
            proxy_cache_valid 200 60d;
            proxy_cache_valid 404 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Range" always;
            add_header Cache-Control "public, max-age=5184000, immutable" always;
            add_header X-Tile-Cache $upstream_cache_status always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Range" always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            expires 60d;
        }

        # ── Map Tile Proxy & Cache (ArcGIS Satellite) ──────────────────────
        # Intercepts /tiles/satellite/{z}/{y}/{x} and /api/tiles/satellite/{z}/{y}/{x}
        location ~* ^/(?:api/)?tiles/satellite/(\d+)/(\d+)/(\d+)(?:\.(?:jpg|jpeg|png))?$ {
            set $sat_z $1;
            set $sat_y $2;
            set $sat_x $3;

            proxy_pass https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/$sat_z/$sat_y/$sat_x;
            proxy_set_header Host server.arcgisonline.com;
            proxy_set_header User-Agent "SINE-MDRRMO-Emergency-Response-App/1.0 (contact: admin@sine-mdrrmo.gov.ph)";
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_cache tiles_cache;
            proxy_cache_key "sat-$sat_z-$sat_y-$sat_x";
            proxy_cache_valid 200 60d;
            proxy_cache_valid 404 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Range" always;
            add_header Cache-Control "public, max-age=5184000, immutable" always;
            add_header X-Tile-Cache $upstream_cache_status always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Range" always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            expires 60d;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Serve storage files directly + full CORS support for browser / ngrok fetches
        # ^~ ensures prefix match stops regex matching, completely disabling PHP execution inside storage
        location ^~ /storage/ {
            alias /var/www/html/public/storage/;
            expires 7d;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, ngrok-skip-browser-warning, Range, User-Agent" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

            # Explicitly block any attempt to execute PHP files inside the storage directory
            location ~ \.php$ {
                deny all;
                return 404;
            }

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, ngrok-skip-browser-warning, Range, User-Agent" always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # ── Laravel Reverb WebSocket proxy ──────────────────────────────
        # Pusher-protocol clients connect to /app/{key} (subscribe) and
        # /apps/{key} (auth). Both paths are forwarded to the reverb
        # container. Upgrade + Connection headers are mandatory for the
        # HTTP→WS upgrade handshake. Long read/send timeouts prevent Nginx
        # from closing idle WebSocket connections prematurely.
        # reverb is the service hostname on mdrrmo_net.
        location /app/ {
            proxy_pass         http://host.containers.internal:6001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /apps/ {
            proxy_pass         http://host.containers.internal:6001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ \.php$ {
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include       fastcgi_params;
            fastcgi_read_timeout 60;
        }

        location ~ /\. { deny all; }
    }
}
