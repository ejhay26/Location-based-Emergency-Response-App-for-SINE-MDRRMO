user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    client_max_body_size 22M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Serve storage files directly + add CORS so the Ionic app can load images
        location /storage {
            alias /var/www/html/public/storage;
            expires 7d;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            if ($request_method = OPTIONS) { return 204; }
        }

        # ── Laravel Reverb WebSocket proxy ──────────────────────────────
        # Pusher-protocol clients connect to /app/{key} (subscribe) and
        # /apps/{key} (auth). Both paths are forwarded to the reverb
        # container. Upgrade + Connection headers are mandatory for the
        # HTTP→WS upgrade handshake. Long read/send timeouts prevent Nginx
        # from closing idle WebSocket connections prematurely.
        # mdrrmo_reverb is the Docker service hostname on mdrrmo_net.
        location /app/ {
            proxy_pass         http://mdrrmo_reverb:6001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /apps/ {
            proxy_pass         http://mdrrmo_reverb:6001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ \.php$ {
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include       fastcgi_params;
            fastcgi_read_timeout 60;
        }

        location ~ /\. { deny all; }
    }
}
